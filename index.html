<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<title>Hifz Companion — QURRA Hifz Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%93%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --deep-green:#0B3026;
  --forest:#123D31;
  --cream:#F4EBD8;
  --ivory:#FAF6EC;
  --gold:#B89A5A;
  --soft-gold:#D7C28A;
  --charcoal:#1F211D;
  --olive:#66685F;
  --border-beige:#CDBD98;
  --success:#2E6B4F;
  --success-bg:#E7EFE8;
  --error:#9B4D4D;
  --error-bg:#F3E7E7;
  --amber:#A9752C;
  --amber-bg:#F1E4CC;
  --font-serif:'Cormorant Garamond', serif;
  --font-sans:'Inter', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ivory);
  color:var(--charcoal);
  font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit;}
#app{max-width:900px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
h1,h2,h3{font-family:var(--font-serif);color:var(--deep-green);margin:0 0 8px;font-weight:600;}
p{line-height:1.6;color:var(--charcoal);margin:0 0 10px;}
.muted{color:var(--olive);font-size:13.5px;}
.eyebrow{font-family:var(--font-sans);font-size:12px;color:var(--gold);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px;}

/* ---------- Nav ---------- */
.nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;background:var(--deep-green);color:var(--ivory);
  flex-wrap:wrap;gap:10px;
}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-serif);font-size:20px;letter-spacing:0.02em;}
.brand .mark{
  width:28px;height:28px;border-radius:50%;border:1.5px solid var(--soft-gold);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--soft-gold);flex:0 0 auto;
}
.nav-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.navlinks{display:flex;gap:16px;font-size:13.5px;flex-wrap:wrap;}
.navlinks button{
  background:none;border:none;color:var(--ivory);opacity:0.72;cursor:pointer;
  font-family:var(--font-sans);font-size:13.5px;padding:4px 0;
}
.navlinks button.active{opacity:1;border-bottom:1.5px solid var(--soft-gold);}
.lang-toggle{display:flex;gap:2px;border:1px solid rgba(250,246,236,0.35);border-radius:6px;padding:2px;flex-shrink:0;}
.lang-toggle button{
  background:none;border:none;color:var(--ivory);opacity:0.7;cursor:pointer;
  font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:0.03em;
  padding:4px 9px;border-radius:4px;
}
.lang-toggle button.active{opacity:1;background:var(--soft-gold);color:var(--charcoal);}

main{flex:1;padding:22px 18px 60px;}
@media (min-width:600px){ main{padding:28px 24px 60px;} }

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-sans);font-size:14.5px;font-weight:600;
  padding:12px 22px;border-radius:6px;cursor:pointer;border:1px solid transparent;
  transition:opacity .15s ease;
}
.btn-primary{background:var(--deep-green);color:var(--ivory);}
.btn-primary:hover{opacity:0.92;}
.btn-secondary{background:transparent;color:var(--deep-green);border-color:var(--border-beige);}
.btn-secondary:hover{background:var(--cream);}
.btn-accent{background:var(--gold);color:var(--charcoal);}
.btn-block{width:100%;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn-plain{background:none;border:none;color:var(--olive);font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0;}
.btn-sm{padding:8px 14px;font-size:13px;}

/* ---------- Cards ---------- */
.card{background:var(--cream);border:1px solid var(--border-beige);border-radius:10px;padding:18px;}
.due-card{background:var(--cream);border:1px solid var(--border-beige);border-radius:10px;padding:16px 18px;margin-bottom:14px;}
.due-card .dctitle{font-family:var(--font-serif);font-size:17px;color:var(--deep-green);margin-bottom:4px;}
.due-card .dcbody{font-size:14px;color:var(--charcoal);margin-bottom:12px;}
.due-card.empty{opacity:0.7;}
.due-card.done{background:var(--success-bg);border-color:var(--success);}
.due-card.done .dctitle{color:var(--success);}
.dc-check{display:inline-flex;align-items:center;gap:6px;color:var(--success);font-size:13px;font-weight:600;}

.all-done-card{
  background:linear-gradient(160deg, var(--deep-green), var(--forest));
  color:var(--ivory);border-radius:12px;padding:30px 24px;text-align:center;
}
.all-done-card h2{color:var(--ivory);}
.all-done-card p{color:rgba(244,235,216,0.86);}

/* ---------- Streak strip ---------- */
.streak-strip{display:flex;gap:12px;margin:16px 0 22px;flex-wrap:wrap;}
.streak-box{flex:1;min-width:110px;background:var(--cream);border:1px solid var(--border-beige);border-radius:10px;padding:12px 14px;text-align:center;}
.streak-box .snum{font-family:var(--font-serif);font-size:23px;color:var(--deep-green);}
.streak-box .slabel{font-size:11.5px;color:var(--olive);margin-top:2px;}

/* ---------- Needs attention ---------- */
.attn-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.attn-chip{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber);border-radius:20px;padding:5px 12px;font-size:12.5px;}

/* ---------- Forms ---------- */
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;color:var(--olive);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.03em;}
.field select, .field input[type=number], .field input[type=text]{
  width:100%;padding:11px 12px;border:1px solid var(--border-beige);border-radius:6px;
  background:var(--ivory);color:var(--charcoal);font-family:var(--font-sans);font-size:14.5px;
}
.field textarea{
  width:100%;padding:11px 12px;border:1px solid var(--border-beige);border-radius:6px;
  background:var(--ivory);color:var(--charcoal);font-family:var(--font-sans);font-size:14.5px;min-height:70px;resize:vertical;
}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.choice-group{display:flex;gap:8px;flex-wrap:wrap;}
.choice{
  padding:10px 16px;border:1px solid var(--border-beige);border-radius:20px;cursor:pointer;
  font-size:13.5px;background:var(--ivory);color:var(--charcoal);
}
.choice.selected{background:var(--deep-green);color:var(--ivory);border-color:var(--deep-green);}
.rating-group{display:flex;gap:8px;}
.rating-choice{flex:1;text-align:center;padding:12px 6px;border:1px solid var(--border-beige);border-radius:8px;cursor:pointer;font-size:13.5px;background:var(--ivory);}
.rating-choice.selected.lemah{background:var(--error-bg);border-color:var(--error);color:var(--error);font-weight:600;}
.rating-choice.selected.sederhana{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);font-weight:600;}
.rating-choice.selected.lancar{background:var(--success-bg);border-color:var(--success);color:var(--success);font-weight:600;}

/* ---------- Modal (log entry) ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(31,33,29,0.45);display:flex;align-items:flex-end;justify-content:center;
  z-index:50;
}
@media (min-width:640px){ .modal-overlay{align-items:center;} }
.modal-sheet{
  background:var(--ivory);border-radius:16px 16px 0 0;padding:22px 20px 28px;width:100%;max-width:520px;
  max-height:88vh;overflow-y:auto;border-top:1px solid var(--border-beige);
}
@media (min-width:640px){ .modal-sheet{border-radius:14px;border:1px solid var(--border-beige);max-height:80vh;} }
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--olive);cursor:pointer;line-height:1;}

/* ---------- Setup / Rancang ---------- */
.setup-section{margin-bottom:26px;}
.setup-section h3{font-size:17px;margin-bottom:6px;}
.surah-picker{max-height:280px;overflow-y:auto;border:1px solid var(--border-beige);border-radius:8px;padding:8px;background:var(--ivory);}
.surah-picker-item{display:flex;align-items:center;gap:10px;padding:7px 8px;font-size:13.5px;border-radius:5px;}
.surah-picker-item:hover{background:var(--cream);}
.surah-picker-item input{flex:0 0 auto;}
.juz-heading{font-size:11px;color:var(--olive);text-transform:uppercase;letter-spacing:0.05em;padding:8px 8px 2px;}

/* ---------- Peta Hifz grid ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 18px;font-size:12px;color:var(--olive);}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle;}
.hifz-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
@media (min-width:480px){ .hifz-grid{grid-template-columns:repeat(8,1fr);} }
@media (min-width:700px){ .hifz-grid{grid-template-columns:repeat(10,1fr);} }
.surah-cell{
  position:relative;aspect-ratio:1;border-radius:6px;border:1px solid var(--border-beige);
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
  background:var(--ivory);font-size:10px;color:var(--olive);padding:2px;text-align:center;
}
.surah-cell .cno{font-family:var(--font-serif);font-size:13px;color:var(--charcoal);}
.surah-cell.not_started{background:var(--ivory);}
.surah-cell.in_progress{background:var(--soft-gold);border-color:var(--gold);}
.surah-cell.in_progress .cno{color:var(--charcoal);}
.surah-cell.memorised{background:var(--deep-green);border-color:var(--deep-green);}
.surah-cell.memorised .cno{color:var(--ivory);}
.surah-cell.needs_attention{background:var(--amber);border-color:var(--amber);}
.surah-cell.needs_attention .cno{color:var(--ivory);}
.juz-badge{position:absolute;top:-6px;left:-4px;background:var(--forest);color:var(--soft-gold);font-size:8px;
  border-radius:8px;padding:1px 4px;line-height:1.4;}

/* ---------- Surah detail modal ---------- */
.detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-beige);font-size:13.5px;}
.detail-row:last-child{border-bottom:none;}

/* ---------- Riwayat ---------- */
.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.entry-row{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border-beige);gap:10px;}
.entry-row:last-child{border-bottom:none;}
.entry-main{font-size:14px;}
.entry-date{font-size:11.5px;color:var(--olive);margin-bottom:2px;}
.type-badge{font-size:10.5px;padding:3px 8px;border-radius:10px;white-space:nowrap;}
.type-badge.new{background:var(--soft-gold);color:var(--charcoal);}
.type-badge.murajaah_recent{background:var(--border-beige);color:var(--charcoal);}
.type-badge.murajaah_old{background:var(--forest);color:var(--ivory);}
.rating-tag{font-size:11px;margin-left:6px;}
.rating-tag.lemah{color:var(--error);}
.rating-tag.sederhana{color:var(--amber);}
.rating-tag.lancar{color:var(--success);}
.empty-state{padding:34px 16px;text-align:center;color:var(--olive);}
.back-link{background:none;border:none;color:var(--olive);font-size:13.5px;cursor:pointer;margin-bottom:14px;padding:0;}
.back-link:hover{color:var(--charcoal);}
footer.page-footer{padding:16px 20px 26px;text-align:center;font-size:11.5px;color:var(--olive);}

[tabindex]:focus-visible, button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

/* ---------- Assessment wizard ---------- */
.progress-track{height:6px;background:var(--border-beige);border-radius:4px;overflow:hidden;margin-bottom:24px;}
.progress-fill{height:100%;background:var(--gold);transition:width .2s ease;}
.quiz-footer{display:flex;justify-content:space-between;margin-top:24px;}

/* ---------- Rancang dashboard ---------- */
.dash-section{margin-bottom:22px;}
.dash-section h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.dash-card{background:var(--cream);border:1px solid var(--border-beige);border-radius:10px;padding:18px;}
.dash-card.prominent{border-color:var(--gold);border-width:1.5px;}

.ring-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.ring-svg{flex:0 0 auto;}
.ring-stats{flex:1;min-width:140px;}
.ring-big{font-family:var(--font-serif);font-size:30px;color:var(--deep-green);line-height:1.1;}
.ring-sub{font-size:12.5px;color:var(--olive);margin-top:2px;}

.bar-track{height:10px;background:var(--border-beige);border-radius:6px;overflow:hidden;margin:10px 0;}
.bar-fill{height:100%;border-radius:6px;transition:width .2s ease;}
.bar-fill.gold{background:var(--gold);}
.bar-fill.green{background:var(--deep-green);}
.stat-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--olive);margin-top:8px;}
.stat-row strong{color:var(--charcoal);font-weight:600;}

.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.day-card{
  border:1px solid var(--border-beige);border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;
  background:var(--ivory);font-size:11px;color:var(--olive);
}
.day-card .dname{font-family:var(--font-serif);font-size:13px;color:var(--charcoal);margin-bottom:4px;}
.day-card.active{background:var(--deep-green);border-color:var(--deep-green);}
.day-card.active .dname{color:var(--ivory);}
.day-card.active .ddot{color:var(--soft-gold);}
.day-card .ddot{font-size:9px;}

</style>
</head>

// Precompute which (surah, ayahFrom, ayahTo) spans make up each Juz - needed to
// determine "is this Juz fully memorised" and to apply a Juz-level murajaah
// rating across every surah-portion it touches.
const JUZ_SURAH_SPANS = {}; // juz -> [{surah, fromAyah, toAyah}]
(function buildJuzSpans(){
  for(let j = 1; j <= 30; j++){
    const startInfo = JUZ_STARTS.find(x => x.juz === j);
    const nextInfo = JUZ_STARTS.find(x => x.juz === j+1); // undefined for j===30
    const spans = [];
    let surah = startInfo.surah;
    let guard = 0;
    while(guard++ < 130){
      const isLastSurahOfJuz = nextInfo && nextInfo.surah === surah;
      const toAyah = isLastSurahOfJuz ? (nextInfo.ayah - 1) : getSurah(surah).totalAyah;
      spans.push({ surah, fromAyah: (surah===startInfo.surah ? startInfo.ayah : 1), toAyah });
      if(isLastSurahOfJuz) break;
      if(!nextInfo && surah === 114) break; // Juz 30 runs to the end of the Quran
      surah++;
    }
    JUZ_SURAH_SPANS[j] = spans;
  }
})();

function defaultProgress(){
  return {
    schema_version: 2,
    plan: {
      setupDone: false,
      direction: 'front-to-back', // 'front-to-back' | 'back-to-front'
      positionPointer: { surah: 1, ayah: 1 },
      paceTarget: { pageFraction: 0.5, customPages: null, customAyat: null },
      hafalanDaysPerWeek: 5,
      murajaahCycleDays: 7,
      murajaahCapacityPerDay: 1, // self-estimated Juz/day capacity, drives the recommended cycle length
      cycleStartDate: null,      // set once, when setup first completes - never reset afterward
      preferredTime: null,
      activeDays: []
    },
    surahStatus: {},
    entries: [], // {id,date,type:'new', surah,ayahFrom,ayahTo,rating,note} | {id,date,type:'murajaah', juz,rating,note}
    streak: { current: 0, longest: 0, lastActiveDate: null }
  };
}

function migrateEntry(e){
  if(e.type === 'murajaah_recent' || e.type === 'murajaah_old'){
    // best-effort: old entries were surah-based: convert to whichever Juz that surah's start ayah belongs to
    const badges = juzBadgesForSurah(e.surah);
    const juz = badges.length ? badges[0] : (JUZ_STARTS.slice().reverse().find(j => j.surah <= e.surah)||{juz:1}).juz;
    return { id:e.id, date:e.date, type:'murajaah', juz, rating:e.rating, note:e.note||'' };
  }
  return e;
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultProgress();
    const p = JSON.parse(raw);
    if(!p) return defaultProgress();
    const wasOldSchema = p.schema_version !== 2;
    const d = defaultProgress();
    p.plan = Object.assign({}, d.plan, p.plan||{});
    p.surahStatus = p.surahStatus || {};
    p.entries = (p.entries || []).map(migrateEntry);
    p.streak = Object.assign({}, d.streak, p.streak||{});
    p.schema_version = 2;
    if(wasOldSchema) saveProgress(p); // persist the upgrade immediately, not just in-memory
    return p;
  }catch(e){ return defaultProgress(); }
}
function saveProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){ /* best effort */ }
}

function loadLanguagePreference(){
  try{
    const raw = localStorage.getItem(LANGUAGE_STORAGE_KEY);
    if(raw === 'en' || raw === 'ms') return raw;
  }catch(e){ /* best effort */ }
  return 'ms';
}
function persistLanguage(lang){
  try{ localStorage.setItem(LANGUAGE_STORAGE_KEY, lang); }catch(e){ /* best effort */ }
}
var LANG = loadLanguagePreference();

function t(key, vars){
  const dict = I18N[LANG] || I18N.ms;
  let str = (key in dict) ? dict[key] : ((key in I18N.ms) ? I18N.ms[key] : key);
  if(vars){
    Object.keys(vars).forEach(k => { str = str.split('{'+k+'}').join(vars[k]); });
  }
  return str;
}
function setLanguage(lang){
  if(lang !== 'en' && lang !== 'ms') return;
  LANG = lang;
  persistLanguage(lang);
  document.documentElement.setAttribute('lang', lang === 'en' ? 'en' : 'ms');
  render();
}

// ===================== Date helpers =====================
function todayStr(){
  const d = new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function addDaysStr(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function daysBetween(dateStr1, dateStr2){
  const a = new Date(dateStr1 + 'T00:00:00'), b = new Date(dateStr2 + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

// ===================== Surah status helpers =====================
function ensureSurahStatus(no){
  if(!PROGRESS.surahStatus[no]){
    PROGRESS.surahStatus[no] = { status:'not_started', memorisedUpTo:0, lastRating:null, lastRevisedDate:null };
  }
  return PROGRESS.surahStatus[no];
}
function getSurahStatus(no){
  return PROGRESS.surahStatus[no] || { status:'not_started', memorisedUpTo:0, lastRating:null, lastRevisedDate:null };
}
function surahCellState(no){
  const st = getSurahStatus(no);
  if(st.status === 'not_started') return 'not_started';
  if(st.status === 'in_progress') return 'in_progress';
  return st.lastRating === 'lemah' ? 'needs_attention' : 'memorised';
}

// ===================== Juz-level helpers =====================
function isJuzFullyMemorised(j){
  return JUZ_SURAH_SPANS[j].every(sp => getSurahStatus(sp.surah).memorisedUpTo >= sp.toAyah);
}
function memorisedJuzList(){
  const out = [];
  for(let j=1;j<=30;j++){ if(isJuzFullyMemorised(j)) out.push(j); }
  return out;
}

// ===================== Traversal order (Hafalan Baru) =====================
function traversalOrder(){
  const base = SURAHS.map(s => s.no);
  return PROGRESS.plan.direction === 'back-to-front' ? base.slice().reverse() : base;
}
function nextSurahNo(current){
  const order = traversalOrder();
  const idx = order.indexOf(current);
  return order[(idx + 1) % order.length];
}

// ===================== New-Hifz suggestion =====================
function computeSuggestedNew(){
  const pos = PROGRESS.plan.positionPointer;
  const surah = getSurah(pos.surah);
  if(!surah) return null;
  if(pos.ayah > surah.totalAyah) return null; // whole Quran done
  const pace = PROGRESS.plan.paceTarget;
  let targetAyat;
  if(pace.pageFraction === 'custom' && pace.customAyat){
    targetAyat = pace.customAyat;
  } else if(pace.pageFraction === 'custom'){
    targetAyat = Math.round((pace.customPages||1) * surah.ayatPerPage);
  } else {
    targetAyat = Math.round((pace.pageFraction||0.5) * surah.ayatPerPage);
  }
  targetAyat = Math.max(1, targetAyat || 1);
  const ayahToSuggested = Math.min(pos.ayah + targetAyat - 1, surah.totalAyah);
  return { surah: pos.surah, ayahFrom: pos.ayah, ayahToSuggested };
}

// ===================== Murajaah: calendar-based rotation =====================
// The whole point: "today's Juz" is derived purely from the date and the
// current cycle length, never from a log of what was or wasn't done. Missing
// a day never creates a backlog - tomorrow's slot is unaffected either way.
function computeTodaysMurajaah(){
  const juzList = memorisedJuzList();
  const J = juzList.length;
  const M = Math.max(1, PROGRESS.plan.murajaahCycleDays || 7);
  if(J === 0 || !PROGRESS.plan.cycleStartDate){
    return { active:false, dueJuz:[], dayInCycle:0, cycleDays:M, completedThisCycle:0, totalJuz:0, bonusWeak:[] };
  }
  const totalDays = Math.max(0, daysBetween(PROGRESS.plan.cycleStartDate, todayStr()));
  const dayInCycle = totalDays % M;
  const dueJuz = juzList.filter((_, idx) => idx % M === dayInCycle);

  const cycleIterationStart = addDaysStr(todayStr(), -dayInCycle);
  const loggedThisCycle = new Set(
    PROGRESS.entries.filter(e => e.type==='murajaah' && e.date >= cycleIterationStart).map(e => e.juz)
  );

  // Supplementary (non-scheduling) hint: any needs-attention surah, shown
  // alongside today's due Juz as an optional extra, never forcing a reschedule.
  const bonusWeak = needsAttentionList().map(s => s.name);

  return {
    active: true, dueJuz, dayInCycle, cycleDays: M,
    completedThisCycle: loggedThisCycle.size, totalJuz: J,
    doneToday: dueJuz.every(j => loggedThisCycle.has(j)),
    bonusWeak
  };
}

function applyMurajaahEntry(juz, rating, date){
  JUZ_SURAH_SPANS[juz].forEach(sp => {
    const st = getSurahStatus(sp.surah);
    if(st.memorisedUpTo > 0){ // only rate portions actually memorised
      const real = ensureSurahStatus(sp.surah);
      real.lastRating = rating;
      real.lastRevisedDate = date;
    }
  });
}

// ===================== Logging =====================
function logEntry(data){
  const date = todayStr();
  let entry;
  if(data.type === 'new'){
    entry = { id: Date.now()+'-'+Math.random().toString(36).slice(2), date, type:'new',
      surah:data.surah, ayahFrom:data.ayahFrom, ayahTo:data.ayahTo, rating:data.rating, note:data.note||'' };
    PROGRESS.entries.push(entry);
    const st = ensureSurahStatus(data.surah);
    st.lastRating = data.rating; st.lastRevisedDate = date;
    const surahRef = getSurah(data.surah);
    st.memorisedUpTo = Math.max(st.memorisedUpTo, data.ayahTo);
    st.status = st.memorisedUpTo >= surahRef.totalAyah ? 'memorised' : 'in_progress';
    if(data.surah === PROGRESS.plan.positionPointer.surah){
      if(st.status === 'memorised'){
        let next = nextSurahNo(data.surah), guard = 0;
        while(getSurahStatus(next).status === 'memorised' && guard < 114){ next = nextSurahNo(next); guard++; }
        const nextSt = getSurahStatus(next);
        PROGRESS.plan.positionPointer = { surah: next, ayah: (nextSt.memorisedUpTo||0) + 1 };
      } else {
        PROGRESS.plan.positionPointer = { surah: data.surah, ayah: st.memorisedUpTo + 1 };
      }
    }
  } else {
    entry = { id: Date.now()+'-'+Math.random().toString(36).slice(2), date, type:'murajaah',
      juz:data.juz, rating:data.rating, note:data.note||'' };
    PROGRESS.entries.push(entry);
    applyMurajaahEntry(data.juz, data.rating, date);
  }
  updateStreak(date);
  saveProgress(PROGRESS);
  return entry;
}

function updateStreak(date){
  const s = PROGRESS.streak;
  if(s.lastActiveDate === date) return;
  const yesterday = addDaysStr(date, -1);
  s.current = (s.lastActiveDate === yesterday) ? s.current + 1 : 1;
  s.longest = Math.max(s.longest, s.current);
  s.lastActiveDate = date;
}

// ===================== Today completion =====================
function isTodayComplete(){
  if(!PROGRESS.plan.setupDone) return false;
  const t = todayStr();
  const newDue = computeSuggestedNew();
  const newLoggedToday = PROGRESS.entries.some(e => e.date===t && e.type==='new');
  const newOk = !newDue || newLoggedToday;
  const m = computeTodaysMurajaah();
  const murajaahOk = !m.active || m.dueJuz.length===0 || m.doneToday;
  return newOk && murajaahOk;
}

// ===================== Whole-Quran progress =====================
function totalMemorisedAyatCount(){
  return SURAHS.reduce((sum,s) => sum + (getSurahStatus(s.no).status==='memorised' ? s.totalAyah : (getSurahStatus(s.no).memorisedUpTo||0)), 0);
}
function totalAyatInQuran(){ return SURAHS.reduce((sum,s)=>sum+s.totalAyah,0); }
function percentMemorised(){ return Math.round((totalMemorisedAyatCount() / totalAyatInQuran()) * 100); }
function needsAttentionList(){
  return SURAHS.filter(s => getSurahStatus(s.no).status==='memorised' && getSurahStatus(s.no).lastRating==='lemah');
}

// Human-readable "starting point" - shows "Juz N" only when the actual
// position pointer sits exactly at a real Juz boundary (e.g. baseline import
// of complete Juz 1-10 correctly continues at "Juz 11"); otherwise shows the
// precise Surah+Ayah, since that's what the pointer actually is for any
// irregular/individual-surah selection. Language-aware: computed fresh from
// LANG at call time, never baked into stored state.
function positionPointerLabel(){
  const pos = PROGRESS.plan.positionPointer;
  const surah = getSurah(pos.surah);
  if(!surah) return '&mdash;';
  if(pos.ayah > surah.totalAyah) return t('positionQuranDone');
  const juzMatch = JUZ_STARTS.find(j => j.surah === pos.surah && j.ayah === pos.ayah);
  if(juzMatch) return t('positionJuz', {n:juzMatch.juz});
  return t('positionSurahAyah', {surah: surah.name, ayah: pos.ayah});
}

// ===================== Assessment -> Recommendation math =====================
function suggestCycleDays(totalJuz, capacityJuzPerDay){
  if(totalJuz <= 0) return 7;
  const days = Math.ceil(totalJuz / Math.max(0.5, capacityJuzPerDay||1));
  return Math.max(5, Math.min(days, 30));
}
function juzPerDayForCycle(totalJuz, cycleDays){
  if(totalJuz <= 0) return 0;
  return Math.ceil(totalJuz / Math.max(1, cycleDays));
}

// ===================== Calendar export (Google Calendar link) =====================
// Reads the existing plan but changes nothing about how Hifz/Murajaah logic
// works. Opens a Google Calendar "add event" link in a new tab - no download,
// no API key, no OAuth, no backend. The link includes ctz (IANA timezone,
// read from the browser) plus wall-clock local times, which is Google's
// documented way to have the event interpreted correctly without needing to
// know or embed timezone offset data ourselves. Title/description text is
// generated fresh from the current LANG at call time, so an exported event
// always matches whichever language was active when "Add to Calendar" was
// clicked.
const CAL_BYDAY = { isnin:'MO', selasa:'TU', rabu:'WE', khamis:'TH', jumaat:'FR', sabtu:'SA', ahad:'SU' };
const CAL_ISO_WEEKDAY = { isnin:1, selasa:2, rabu:3, khamis:4, jumaat:5, sabtu:6, ahad:7 };
const CAL_TIME_CLOCK = { subuh:'0530', pagi:'0800', petang:'1500', maghrib:'1930', malam:'2100' };
const CAL_DEFAULT_TIME = '2000';
const CAL_DURATION_MINUTES = 30;

function nextDateForIsoWeekday(isoWeekdayTarget){
  const now = new Date();
  const curIso = now.getDay() === 0 ? 7 : now.getDay();
  let diff = isoWeekdayTarget - curIso;
  if(diff < 0) diff += 7;
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff);
  return d;
}
function addMinutesClock(hhmm, minutes){
  const h = parseInt(hhmm.slice(0,2),10), m = parseInt(hhmm.slice(2,4),10);
  const total = h*60 + m + minutes;
  const nh = Math.floor((total % (24*60)) / 60), nm = total % 60;
  return String(nh).padStart(2,'0') + String(nm).padStart(2,'0');
}
function getUserTimezone(){
  try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; }catch(e){ return 'UTC'; }
}

function calPaceLabel(paceTarget){
  if(paceTarget.pageFraction === 'custom'){
    return paceTarget.customAyat ? t('calAyatCustom', {n:paceTarget.customAyat}) : t('calPageCustom', {n:paceTarget.customPages||1});
  }
  if(paceTarget.pageFraction === 0.25) return t('calPageQuarter');
  if(paceTarget.pageFraction === 1) return t('calPageOne');
  return t('calPageHalf');
}

// eventType: 'hafalan' | 'murajaah'. Returns { ok:true, url, title } or
// { ok:false, reason } - reason is a user-facing message (in the current
// language) for the one case that can't proceed (no active days chosen yet).
function buildGoogleCalendarUrl(eventType){
  const p = PROGRESS.plan;
  const activeDayKeys = p.activeDays || [];
  if(activeDayKeys.length === 0){
    return { ok:false, reason: t('calendarNoActiveDays') };
  }
  const byDayList = activeDayKeys.map(k => CAL_BYDAY[k]).filter(Boolean);
  const earliestIso = Math.min(...activeDayKeys.map(k => CAL_ISO_WEEKDAY[k]));
  const anchorDate = nextDateForIsoWeekday(earliestIso);
  const clockStart = p.preferredTime ? (CAL_TIME_CLOCK[p.preferredTime] || CAL_DEFAULT_TIME) : CAL_DEFAULT_TIME;
  const clockEnd = addMinutesClock(clockStart, CAL_DURATION_MINUTES);
  const timeNote = p.preferredTime === 'maghrib' ? t('calMaghribNote') : '';

  const pad = n => String(n).padStart(2,'0');
  const datePart = `${anchorDate.getFullYear()}${pad(anchorDate.getMonth()+1)}${pad(anchorDate.getDate())}`;
  const datesParam = `${datePart}T${clockStart}00/${datePart}T${clockEnd}00`;

  const paceLabel = calPaceLabel(p.paceTarget);
  const juzCount = memorisedJuzList().length;
  const dailyMurajaahTarget = juzPerDayForCycle(juzCount, p.murajaahCycleDays);

  let title, description;
  if(eventType === 'hafalan'){
    title = t('calHafalanTitle', {pace:paceLabel});
    description = t('calHafalanDesc', {pace:paceLabel, timeNote});
  } else {
    title = t('calMurajaahTitle', {n:dailyMurajaahTarget});
    description = t('calMurajaahDesc', {n:dailyMurajaahTarget, cycle:p.murajaahCycleDays, timeNote});
  }

  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: title.replace(/&mdash;/g,'—'),
    dates: datesParam,
    details: description.replace(/&mdash;/g,'—'),
    recur: `RRULE:FREQ=WEEKLY;BYDAY=${byDayList.join(',')}`,
    ctz: getUserTimezone()
  });
  return { ok:true, url:`https://calendar.google.com/calendar/render?${params.toString()}`, title };
}

  return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Rough Juz-equivalent of a surah selection, for the live illustrative hint in
// Step 4 only - the real, authoritative count shown in Rancang afterward is
// always memorisedJuzList().length (only counts genuinely COMPLETE Juz).
function approxJuzFromSelection(selectionSet){
  const totalAyahSelected = SURAHS.reduce((sum,s) => sum + (selectionSet.has(s.no) ? s.totalAyah : 0), 0);
  return Math.round(totalAyahSelected / (totalAyatInQuran()/30));
}

function ringSvg(pct, size){
  size = size || 104;
  const r = (size/2) - 10;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - Math.min(100,Math.max(0,pct))/100);
  const mid = size/2;
  return `
  <svg class="ring-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${mid}" cy="${mid}" r="${r}" fill="none" stroke="var(--border-beige)" stroke-width="9"/>
    <circle cx="${mid}" cy="${mid}" r="${r}" fill="none" stroke="var(--deep-green)" stroke-width="9"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" stroke-linecap="round"
      transform="rotate(-90 ${mid} ${mid})"/>
  </svg>`;
}

// ===================== Events =====================
function bindEvents(){
  app.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', () => go(el.getAttribute('data-nav'))));

  const langToggle = document.getElementById('langToggle');
  if(langToggle) langToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-lang]');
    if(!btn) return;
    setLanguage(btn.getAttribute('data-lang'));
  });

  // ---------- Home quick-log ----------
  const newBtn = app.querySelector('[data-action="log-new"]');
  if(newBtn) newBtn.addEventListener('click', () => {
    const sug = computeSuggestedNew();
    openModal({ type:'log-new', prefill:{ surah:sug.surah, ayahFrom:sug.ayahFrom, ayahTo:sug.ayahToSuggested }, rating:null, note:'' });
  });
  const murajaahBtn = app.querySelector('[data-action="log-murajaah"]');
  if(murajaahBtn) murajaahBtn.addEventListener('click', () => {
    const juz = parseInt(murajaahBtn.getAttribute('data-juz'),10);
    openModal({ type:'log-murajaah', prefill:{ juz }, rating:null, note:'' });
  });

  // ---------- Assessment wizard ----------
  if(!STATE.assessmentForm && STATE.screen === 'assessment') initAssessmentForm();
  app.querySelectorAll('[data-set-assess]').forEach(el => el.addEventListener('click', () => {
    const [field, raw] = el.getAttribute('data-set-assess').split(':');
    const numericFields = ['pageFraction','capacity','cycleDays'];
    let value = raw;
    if(numericFields.includes(field) && raw !== 'custom') value = parseFloat(raw);
    STATE.assessmentForm[field] = value;
    render();
  }));
  app.querySelectorAll('[data-toggle-day]').forEach(el => el.addEventListener('click', () => {
    const key = el.getAttribute('data-toggle-day');
    if(STATE.assessmentForm.activeDays.has(key)) STATE.assessmentForm.activeDays.delete(key);
    else STATE.assessmentForm.activeDays.add(key);
    render();
  }));
  app.querySelectorAll('[data-baseline-surah]').forEach(el => el.addEventListener('change', () => {
    const no = parseInt(el.getAttribute('data-baseline-surah'),10);
    if(el.checked) STATE.assessmentForm.baselineSelection.add(no);
    else STATE.assessmentForm.baselineSelection.delete(no);
    // no render() here - the checkbox already reflects its own new state visually,
    // and a full re-render on every checkbox click would be needlessly disruptive
    // (this mirrors the same fix applied to the old Rancang picker previously)
  }));
  app.querySelectorAll('[data-form-field]').forEach(el => {
    if(el.closest('.modal-sheet')) return; // modal fields are bound separately below
    el.addEventListener('input', () => {
      const field = el.getAttribute('data-form-field');
      STATE.assessmentForm[field] = el.value ? parseFloat(el.value) : null;
    });
  });
  const assessNext = app.querySelector('[data-action="assess-next"]');
  if(assessNext) assessNext.addEventListener('click', () => {
    if(STATE.assessmentStep < 4){ STATE.assessmentStep++; render(); }
    else { STATE.screen = 'recommendation'; render(); }
  });
  const assessBack = app.querySelector('[data-action="assess-back"]');
  if(assessBack) assessBack.addEventListener('click', () => { STATE.assessmentStep = Math.max(1, STATE.assessmentStep-1); render(); });

  // ---------- Recommendation ----------
  const acceptBtn = app.querySelector('[data-action="accept-recommendation"]');
  if(acceptBtn) acceptBtn.addEventListener('click', () => {
    const f = STATE.assessmentForm;
    const approxJuz = approxJuzFromSelection(f.baselineSelection);
    const cycleDays = f.cycleDays || suggestCycleDays(approxJuz, f.capacity);

    // Baseline import: apply EXACTLY the surahs the user checked/unchecked in
    // Step 1 - never inferred from a Juz count. Checking a surah marks it fully
    // memorised; unchecking one only reverts it if it has no real logged entries
    // behind it (never destroys genuine logged progress). Already-memorised
    // surahs the user left checked are left completely untouched (their real
    // rating/history is preserved, not overwritten by this screen's quality pick).
    const chosenRating = QUALITY_TO_RATING[f.quality] || 'sederhana';
    SURAHS.forEach(s => {
      const wasMemorised = getSurahStatus(s.no).status === 'memorised';
      const nowChecked = f.baselineSelection.has(s.no);
      if(nowChecked && !wasMemorised){
        const st = ensureSurahStatus(s.no);
        st.status = 'memorised'; st.memorisedUpTo = s.totalAyah;
        st.lastRating = chosenRating; st.lastRevisedDate = todayStr();
      } else if(!nowChecked && wasMemorised && !PROGRESS.entries.some(e => e.type==='new' && e.surah===s.no)){
        delete PROGRESS.surahStatus[s.no];
      }
    });

    PROGRESS.plan.direction = f.direction;
    PROGRESS.plan.paceTarget.pageFraction = f.pageFraction;
    PROGRESS.plan.paceTarget.customPages = f.pageFraction==='custom' ? f.customPages : null;
    PROGRESS.plan.paceTarget.customAyat = f.pageFraction==='custom' ? f.customAyat : null;
    PROGRESS.plan.hafalanDaysPerWeek = f.hafalanDaysPerWeek || 5;
    PROGRESS.plan.preferredTime = f.preferredTime;
    PROGRESS.plan.activeDays = [...f.activeDays];
    PROGRESS.plan.murajaahCapacityPerDay = f.capacity;
    PROGRESS.plan.murajaahCycleDays = cycleDays;
    if(!PROGRESS.plan.cycleStartDate) PROGRESS.plan.cycleStartDate = todayStr(); // anchor set once, ever

    // Recompute the new-Hifz position pointer: first non-memorised surah in traversal order
    const surahOrder = traversalOrder();
    let next = surahOrder.find(no => getSurahStatus(no).status !== 'memorised');
    if(next === undefined) next = surahOrder[surahOrder.length-1];
    const nextSt = getSurahStatus(next);
    PROGRESS.plan.positionPointer = { surah: next, ayah: (nextSt.memorisedUpTo||0) + 1 };

    PROGRESS.plan.setupDone = true;
    saveProgress(PROGRESS);
    STATE.assessmentForm = null;
    go('utama');
  });
  const adjustBtn = app.querySelector('[data-action="adjust-recommendation"]');
  if(adjustBtn) adjustBtn.addEventListener('click', () => { STATE.screen='assessment'; STATE.assessmentStep=2; render(); });

  // ---------- Rancang ----------
  const editPlanBtn = app.querySelector('[data-action="edit-plan"]');
  if(editPlanBtn) editPlanBtn.addEventListener('click', () => { initAssessmentForm(); STATE.screen='assessment'; STATE.assessmentStep=1; render(); });

  // ---------- Rancang dashboard ----------
  app.querySelectorAll('[data-day-detail]').forEach(el => el.addEventListener('click', () => {
    openModal({ type:'day', dayKey: el.getAttribute('data-day-detail') });
  }));
  const exportBtn = app.querySelector('[data-action="calendar-choice"]');
  if(exportBtn) exportBtn.addEventListener('click', () => { openModal({ type:'calendar-choice' }); });

  // ---------- Peta Hifz ----------
  app.querySelectorAll('[data-surah-detail]').forEach(el => el.addEventListener('click', () => {
    openModal({ type:'surah', surahNo: parseInt(el.getAttribute('data-surah-detail'),10) });
  }));

  // ---------- Riwayat ----------
  app.querySelectorAll('[data-set-filter]').forEach(el => el.addEventListener('click', () => {
    STATE.riwayatFilter = el.getAttribute('data-set-filter'); render();
  }));

  // ---------- Modal-internal ----------
  if(STATE.modal){
    const overlay = app.querySelector('[data-close-modal]');
    if(overlay) overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
    const sheet = app.querySelector('[data-stop-propagation]');
    if(sheet) sheet.addEventListener('click', (e) => e.stopPropagation());
    const closeBtn = app.querySelector('[data-action="close-modal"]');
    if(closeBtn) closeBtn.addEventListener('click', closeModal);

    app.querySelectorAll('[data-set-rating]').forEach(el => el.addEventListener('click', () => {
      STATE.modal.rating = el.getAttribute('data-set-rating'); render();
    }));
    app.querySelectorAll('[data-open-gcal]').forEach(el => el.addEventListener('click', () => {
      const eventType = el.getAttribute('data-open-gcal');
      const result = buildGoogleCalendarUrl(eventType);
      if(!result.ok){ alert(result.reason); return; }
      window.open(result.url, '_blank', 'noopener');
      closeModal();
    }));
    app.querySelectorAll('.modal-sheet [data-modal-field]').forEach(el => {
      const evt = (el.tagName==='SELECT') ? 'change' : 'input';
      el.addEventListener(evt, () => {
        const field = el.getAttribute('data-modal-field');
        STATE.modal[field] = (field==='surah'||field==='ayahFrom'||field==='ayahTo'||field==='juz') ? parseInt(el.value,10) : el.value;
      });
    });

    const submitNew = app.querySelector('[data-action="submit-log-new"]');
    if(submitNew) submitNew.addEventListener('click', () => {
      if(!STATE.modal.rating){ alert(t('alertPickQuality')); return; }
      const surahEl = document.getElementById('logSurahSelect');
      const fromEl = document.getElementById('logAyahFrom');
      const toEl = document.getElementById('logAyahTo');
      const noteEl = document.getElementById('logNote');
      const surah = parseInt((surahEl?surahEl.value:STATE.modal.surah||STATE.modal.prefill.surah),10);
      const ayahFrom = parseInt((fromEl?fromEl.value:STATE.modal.ayahFrom||STATE.modal.prefill.ayahFrom),10);
      const ayahTo = parseInt((toEl?toEl.value:STATE.modal.ayahTo||STATE.modal.prefill.ayahTo),10);
      const note = noteEl ? noteEl.value : (STATE.modal.note||'');
      if(!ayahFrom || !ayahTo || ayahTo < ayahFrom){ alert(t('alertCheckAyahRange')); return; }
      const surahRef = getSurah(surah);
      if(ayahFrom < 1 || ayahTo > surahRef.totalAyah){ alert(t('alertAyahOutOfRange')); return; }
      logEntry({ type:'new', surah, ayahFrom, ayahTo, rating: STATE.modal.rating, note });
      closeModal();
    });

    const submitMurajaah = app.querySelector('[data-action="submit-log-murajaah"]');
    if(submitMurajaah) submitMurajaah.addEventListener('click', () => {
      if(!STATE.modal.rating){ alert(t('alertPickQuality')); return; }
      const juzEl = document.getElementById('logJuzSelect');
      const noteEl = document.getElementById('logNote');
      const juz = parseInt((juzEl?juzEl.value:STATE.modal.juz||STATE.modal.prefill.juz),10);
      const note = noteEl ? noteEl.value : (STATE.modal.note||'');
      logEntry({ type:'murajaah', juz, rating: STATE.modal.rating, note });
      closeModal();
    });
  }
}

// ===================== Init =====================
document.documentElement.setAttribute('lang', LANG === 'en' ? 'en' : 'ms');
render();

</script>
</body>
</html>
