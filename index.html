<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<title>Hifz Companion — QURRA Hifz Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F9F5EA" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23C9A85E' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 6.6c-1.9-1.4-4.4-2.1-7.6-2.1v13.1c3.2 0 5.7.7 7.6 2.1 1.9-1.4 4.4-2.1 7.6-2.1V4.5c-3.2 0-5.7.7-7.6 2.1z'/%3E%3Cpath d='M12 6.6v13.1'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   Hifz Companion — Cream-first design system
   70% cream · 20% olive · 10% gold + sand
   ========================================================== */
:root{
  /* Core palette */
  --cream:#F9F5EA;        /* main background */
  --green:#254E3D;        /* primary actions, active states */
  --gold:#C9A85E;         /* icons, highlights, hairlines */
  --sand:#E8D9C3;         /* secondary surfaces */
  --ink:#252B28;          /* main text */

  /* Derived tones */
  --surface:#FDFBF5;      /* cards: a lighter cream lifted off the page */
  --cream-deep:#F3ECDC;   /* subtle fills, hover */
  --green-hover:#1E4133;
  --green-tint:#E6ECE5;
  --gold-tint:#F3E8CC;
  --sand-soft:#F1E8D9;
  --muted:#6F726B;
  --faint:#9A9A90;
  --line:rgba(201,168,94,0.30);
  --line-strong:rgba(201,168,94,0.55);
  --attn:#A86A3D;         /* "Perlu Perhatian" — muted terracotta */
  --attn-tint:#F4E5D8;
  --weak:#9B4D4D;  --weak-tint:#F4E6E3;
  --mid:#9A7430;   --mid-tint:#F4EAD3;
  --good:#2F6A4F;  --good-tint:#E5EEE6;

  /* Type */
  --font-serif:'Playfair Display', Georgia, serif;
  --font-sans:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-arabic:'Amiri', 'Noto Naskh Arabic', serif;

  /* Shape + depth */
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --shadow-sm:0 1px 2px rgba(60,48,20,0.05);
  --shadow:0 1px 2px rgba(60,48,20,0.04), 0 6px 20px -8px rgba(60,48,20,0.12);
  --shadow-lg:0 20px 50px -20px rgba(37,43,40,0.35);

  --tabbar-h:68px;
  --sidebar-w:232px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:var(--font-sans);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:lining-nums;
  min-height:100vh;
  overflow-x:hidden;
}
a{color:inherit;}
[dir="rtl"], .arabic{font-family:var(--font-arabic);}
h1,h2,h3{font-family:var(--font-serif);color:var(--ink);margin:0 0 8px;font-weight:500;letter-spacing:-0.005em;}
h2{font-size:26px;line-height:1.2;}
h3{font-size:18px;}
p{line-height:1.6;color:var(--ink);margin:0 0 10px;}
strong{font-weight:600;}
.muted{color:var(--muted);font-size:13.5px;}
.unit{font-family:var(--font-sans);font-size:14px;color:var(--muted);font-weight:400;}
.icon{width:22px;height:22px;flex:0 0 auto;display:inline-block;vertical-align:middle;}
.icon-sm{width:16px;height:16px;}
.icon-lg{width:30px;height:30px;}
.gold{color:var(--gold);}

/* ---------- App shell ---------- */
#app{min-height:100vh;}
.shell{min-height:100vh;display:flex;}
.content{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:4px 16px 24px;}
.shell.no-nav main{padding-bottom:40px;}

.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(14px + env(safe-area-inset-top)) 16px 10px;
  max-width:560px;width:100%;margin:0 auto;
}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-serif);font-size:19px;color:var(--ink);font-weight:500;}
.brand .icon{color:var(--gold);width:26px;height:26px;}

.lang-toggle{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px;flex-shrink:0;}
.lang-toggle button{
  background:none;border:none;color:var(--muted);cursor:pointer;
  font-family:var(--font-sans);font-size:11.5px;font-weight:500;letter-spacing:0.04em;
  padding:5px 11px;border-radius:var(--r-pill);min-height:28px;
}
.lang-toggle button.active{background:var(--green);color:var(--cream);}

/* ---------- Navigation: bottom tab bar (mobile) / sidebar (desktop) ---------- */
.appnav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(249,245,234,0.94);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
}
.appnav .nav-brand, .appnav .nav-foot{display:none;}
.nav-items{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:560px;margin:0 auto;}
.nav-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;cursor:pointer;color:var(--muted);
  font-family:var(--font-sans);font-size:11px;font-weight:500;
  padding:7px 4px;border-radius:var(--r-md);min-height:52px;
  transition:background .15s ease,color .15s ease;
}
.nav-item .icon{width:22px;height:22px;}
.nav-item:hover{color:var(--ink);}
.nav-item.active{background:var(--green);color:var(--cream);box-shadow:0 4px 12px -4px rgba(37,78,61,0.45);}

@media (min-width:960px){
  .appnav{
    position:sticky;top:0;bottom:auto;left:auto;right:auto;height:100vh;
    width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
    border-top:none;border-right:1px solid var(--line);
    background:var(--cream);backdrop-filter:none;
    display:flex;flex-direction:column;padding:28px 16px;
  }
  .appnav .nav-brand{display:flex;padding:0 10px 28px;}
  .appnav .nav-foot{display:block;margin-top:auto;padding:0 10px;font-size:11.5px;color:var(--faint);line-height:1.5;}
  .nav-items{display:flex;flex-direction:column;gap:4px;max-width:none;margin:0;}
  .nav-item{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:11px 14px;min-height:44px;}
  .nav-item.active{box-shadow:none;}
  .nav-item:not(.active):hover{background:var(--cream-deep);}
  .shell:not(.no-nav) .topbar .brand{visibility:hidden;}
  .topbar{max-width:920px;padding:22px 32px 6px;}
  main{max-width:920px;padding:4px 32px 56px;}
  .shell.no-nav main, .shell.no-nav .topbar{max-width:640px;}
}

footer.page-footer{padding:4px 20px 20px;text-align:center;font-size:11.5px;color:var(--faint);}
.shell:not(.no-nav) footer.page-footer{padding-bottom:calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom));}
@media (min-width:960px){ .shell:not(.no-nav) footer.page-footer{display:none;} }

/* ---------- Page header (Rancang / Peta / Riwayat) ---------- */
.page-head{text-align:center;padding:10px 8px 22px;}
.page-head .head-icon{color:var(--gold);margin-bottom:8px;}
.page-head .head-icon .icon{width:36px;height:36px;}
.page-head h2{font-size:30px;margin-bottom:6px;}
.page-head p{color:var(--muted);font-size:14px;margin:0;}
@media (min-width:960px){ .page-head{text-align:left;display:grid;grid-template-columns:auto 1fr;column-gap:16px;align-items:center;padding:12px 0 26px;}
  .page-head .head-icon{grid-row:span 2;margin:0;width:60px;height:60px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .page-head .head-icon .icon{width:30px;height:30px;}
  .page-head h2{margin:0;} }

.section-title{display:flex;align-items:center;gap:10px;font-family:var(--font-serif);font-size:19px;font-weight:500;color:var(--ink);margin:0 0 12px;}
.section-title .icon{color:var(--gold);}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-sans);font-size:14.5px;font-weight:500;
  padding:12px 22px;min-height:46px;border-radius:var(--r-pill);cursor:pointer;border:1px solid transparent;
  transition:background .15s ease,opacity .15s ease,border-color .15s ease;
}
.btn .icon{width:18px;height:18px;}
.btn-primary{background:var(--green);color:var(--cream);box-shadow:0 4px 14px -6px rgba(37,78,61,0.55);}
.btn-primary:hover{background:var(--green-hover);}
.btn-secondary{background:var(--surface);color:var(--green);border-color:var(--line-strong);}
.btn-secondary:hover{background:var(--cream-deep);}
.btn-accent{background:var(--green);color:var(--cream);}
.btn-block{width:100%;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn-plain{background:none;border:none;color:var(--muted);font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0;}
.btn-sm{padding:9px 16px;font-size:13.5px;min-height:40px;}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-sm);}

/* ---------- Utama: hero ---------- */
.hero{position:relative;padding:10px 4px 22px;min-height:128px;}
.hero .greet{font-size:14px;color:var(--muted);margin-bottom:2px;}
.hero h2{font-size:32px;margin:0 0 4px;}
.hero .date{font-size:14px;color:var(--muted);}
.hero-art{position:absolute;right:-6px;bottom:6px;width:148px;height:auto;color:var(--gold);opacity:0.55;pointer-events:none;}
.hero > *:not(.hero-art){position:relative;z-index:1;}
@media (min-width:960px){ .hero{padding:4px 0 26px;} .hero h2{font-size:38px;} .hero-art{width:200px;right:0;} }

/* ---------- Utama: task cards ---------- */
.utama-grid{display:grid;gap:14px;}
@media (min-width:720px){
  .utama-grid{grid-template-columns:1fr 1fr;}
  .utama-grid .span-2{grid-column:span 2;}
}
.task-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;}
.task-head{display:flex;align-items:flex-start;gap:14px;}
.task-icon{color:var(--gold);padding-top:2px;}
.task-icon .icon{width:30px;height:30px;}
.task-info{flex:1;min-width:0;}
.task-title{font-family:var(--font-serif);font-size:19px;color:var(--ink);line-height:1.25;margin-bottom:4px;}
.task-main{font-size:15px;color:var(--ink);}
.task-sub{font-size:14px;color:var(--muted);}
.task-hint{font-size:12.5px;color:var(--faint);margin-top:6px;}
.task-head{margin-bottom:16px;}
.task-card .btn{margin-top:auto;}
.task-card.is-done{background:var(--surface);}
.task-card.is-empty .task-icon{color:var(--faint);}
.done-pill{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 12px 6px 8px;border-radius:var(--r-pill);
  background:var(--green-tint);color:var(--green);font-size:13px;font-weight:500;}
.done-pill .icon{width:16px;height:16px;}
.bonus-note{margin-top:12px;padding:10px 12px;border-radius:var(--r-sm);background:var(--attn-tint);color:var(--attn);font-size:12.5px;line-height:1.45;}

.ring{position:relative;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;}
.ring svg{display:block;}
.ring .ring-label{position:absolute;font-size:12.5px;font-weight:500;color:var(--ink);}

/* All-done card */
.all-done-card{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);padding:28px 22px;text-align:center;box-shadow:var(--shadow);}
.all-done-card .done-mark{width:56px;height:56px;border-radius:50%;margin:0 auto 14px;background:var(--green);color:var(--cream);display:flex;align-items:center;justify-content:center;}
.all-done-card .done-mark .icon{width:26px;height:26px;}
.all-done-card h2{font-size:24px;color:var(--green);}
.all-done-card p{color:var(--muted);margin:0;}

/* Progress card */
.progress-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-sm);}
.progress-card .pc-head{display:flex;align-items:center;gap:12px;}
.progress-card .pc-head .icon{color:var(--gold);width:26px;height:26px;}
.progress-card .pc-title{font-family:var(--font-serif);font-size:18px;}
.progress-card .pc-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:8px;}
.progress-card .pc-juz{font-size:15px;}
.progress-card .pc-pct{font-family:var(--font-serif);font-size:24px;color:var(--ink);line-height:1;}

.bar-track{height:8px;background:var(--sand);border-radius:var(--r-pill);overflow:hidden;margin:10px 0;}
.bar-fill{height:100%;border-radius:var(--r-pill);transition:width .3s ease;}
.bar-fill.gold{background:var(--gold);}
.bar-fill.green{background:var(--green);}

/* Stat tiles */
.stat-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;display:flex;align-items:center;gap:12px;}
.stat-tile .icon{color:var(--gold);width:26px;height:26px;}
.stat-tile .st-label{font-size:12.5px;color:var(--muted);}
.stat-tile .st-val{font-size:17px;color:var(--ink);font-weight:500;}

/* ---------- Forms ---------- */
.field{margin-bottom:18px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px;letter-spacing:0.02em;font-weight:500;}
.field select, .field input[type=number], .field input[type=text], .field textarea{
  width:100%;padding:12px 14px;border:1px solid var(--line-strong);border-radius:var(--r-sm);
  background:var(--surface);color:var(--ink);font-family:var(--font-sans);font-size:15px;min-height:46px;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.field textarea{min-height:76px;resize:vertical;}
.field select:focus, .field input:focus, .field textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(37,78,61,0.12);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.choice-group{display:flex;gap:8px;flex-wrap:wrap;}
.choice{
  padding:9px 16px;min-height:40px;display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line-strong);border-radius:var(--r-pill);cursor:pointer;
  font-size:13.5px;background:var(--surface);color:var(--ink);transition:background .15s ease,border-color .15s ease;
  user-select:none;
}
.choice:hover{background:var(--cream-deep);}
.choice.selected{background:var(--green);color:var(--cream);border-color:var(--green);}
.choice.selected .muted{color:rgba(249,245,234,0.75);}
.rating-group{display:flex;gap:8px;}
.rating-choice{flex:1;text-align:center;padding:12px 6px;min-height:46px;border:1px solid var(--line-strong);border-radius:var(--r-sm);cursor:pointer;font-size:13.5px;background:var(--surface);user-select:none;}
.rating-choice.selected.lemah{background:var(--weak-tint);border-color:var(--weak);color:var(--weak);font-weight:500;}
.rating-choice.selected.sederhana{background:var(--mid-tint);border-color:var(--mid);color:var(--mid);font-weight:500;}
.rating-choice.selected.lancar{background:var(--good-tint);border-color:var(--good);color:var(--good);font-weight:500;}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(37,43,40,0.42);display:flex;align-items:flex-end;justify-content:center;
  z-index:60;animation:fade .15s ease;
}
@media (min-width:640px){ .modal-overlay{align-items:center;padding:20px;} }
.modal-sheet{
  background:var(--cream);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:10px 20px calc(26px + env(safe-area-inset-bottom));width:100%;max-width:520px;
  max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:rise .2s ease;
}
.modal-sheet::before{content:'';display:block;width:40px;height:4px;border-radius:4px;background:var(--sand);margin:0 auto 14px;}
@media (min-width:640px){ .modal-sheet{border-radius:var(--r-lg);max-height:82vh;padding:24px 24px 26px;} .modal-sheet::before{display:none;} }
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;}
.modal-header h3{font-size:21px;}
.modal-close{background:var(--surface);border:1px solid var(--line);width:36px;height:36px;border-radius:50%;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;flex:0 0 auto;}
.modal-close:hover{color:var(--ink);}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}

.option-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-top:12px;cursor:pointer;transition:border-color .15s ease;}
.option-card:hover{border-color:var(--gold);}
.option-card .oc-icon{color:var(--gold);}
.option-card .oc-title{font-size:15px;color:var(--ink);font-weight:500;}
.option-card .oc-sub{font-size:12.5px;color:var(--muted);}
.option-card .oc-chev{margin-left:auto;color:var(--faint);}

/* ---------- Detail rows ---------- */
.detail-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;}
.detail-row:last-child{border-bottom:none;}
.detail-row .dr-label{display:flex;align-items:center;gap:10px;color:var(--muted);}
.detail-row .dr-label .icon{color:var(--gold);width:18px;height:18px;}
.detail-row > span:last-child{text-align:right;}

/* ---------- Assessment wizard ---------- */
.wizard-head{margin:6px 0 22px;}
.wizard-step{font-size:12.5px;color:var(--muted);margin-bottom:10px;}
.progress-track{height:4px;background:var(--sand);border-radius:var(--r-pill);overflow:hidden;}
.progress-fill{height:100%;background:var(--green);transition:width .25s ease;border-radius:var(--r-pill);}
.wizard-body h2{font-size:28px;}
.wizard-body > p.muted{margin-bottom:22px;font-size:14px;}
.quiz-footer{display:flex;justify-content:space-between;gap:12px;margin-top:26px;}
.surah-picker{max-height:300px;overflow-y:auto;border:1px solid var(--line-strong);border-radius:var(--r-md);padding:6px;background:var(--surface);}
.surah-picker-item{display:flex;align-items:center;gap:10px;padding:9px 10px;font-size:14px;border-radius:var(--r-sm);cursor:pointer;}
.surah-picker-item:hover{background:var(--cream-deep);}
.surah-picker-item input{flex:0 0 auto;width:18px;height:18px;accent-color:var(--green);}
.juz-heading{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:0.08em;padding:12px 10px 4px;font-weight:500;}
.summary-note{background:var(--gold-tint);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;font-size:13.5px;color:var(--ink);}
.summary-note strong{color:var(--green);}

/* ---------- Rancang ---------- */
.plan-summary{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-bottom:24px;}
.plan-summary > div{padding:16px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;}
.plan-summary > div + div{border-left:1px solid var(--line);}
.plan-summary .icon{color:var(--gold);width:26px;height:26px;margin-bottom:4px;}
.plan-summary .ps-label{font-size:13.5px;color:var(--ink);font-weight:500;}
.plan-summary .ps-val{font-size:12.5px;color:var(--muted);line-height:1.4;}

.rancang-grid{display:grid;gap:22px;}
@media (min-width:860px){ .rancang-grid{grid-template-columns:1fr 1fr;} .rancang-grid .span-2{grid-column:span 2;} }
.dash-section{min-width:0;}
.dash-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-sm);}
.ring-wrap{display:flex;align-items:center;gap:20px;}
.ring-stats{flex:1;min-width:0;}
.ring-big{font-family:var(--font-serif);font-size:30px;color:var(--ink);line-height:1.1;}
.ring-sub{font-size:13px;color:var(--muted);margin-top:4px;}
.stat-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:13.5px;color:var(--muted);padding:6px 0;}
.stat-row strong{color:var(--ink);font-weight:500;}

.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.day-card{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;background:none;border:none;padding:4px 0;font-family:var(--font-sans);}
.day-card .dname{font-size:12.5px;color:var(--muted);font-weight:500;}
.day-card .dbox{width:100%;max-width:42px;aspect-ratio:1;border-radius:10px;border:1px solid var(--line-strong);background:var(--sand-soft);display:flex;align-items:center;justify-content:center;color:var(--cream);transition:transform .15s ease;}
.day-card:hover .dbox{transform:translateY(-1px);}
.day-card.active .dbox{background:var(--green);border-color:var(--green);}
.day-card.active .dname{color:var(--green);}
.day-card .dbox .icon{width:18px;height:18px;}
.week-hint{font-size:12.5px;color:var(--muted);margin:14px 0 0;}

.settings-list{display:flex;flex-direction:column;gap:10px;}
.settings-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;min-height:62px;cursor:pointer;font-family:var(--font-sans);color:var(--ink);transition:border-color .15s ease,background .15s ease;box-shadow:var(--shadow-sm);}
.settings-row:hover{border-color:var(--gold);}
.settings-row .icon{color:var(--gold);}
.settings-row .sr-title{display:block;font-size:15px;font-weight:500;}
.settings-row .sr-sub{display:block;font-size:12.5px;color:var(--muted);}
.settings-row .sr-chev{margin-left:auto;color:var(--ink);opacity:.7;}

/* ---------- Peta Hifz ---------- */
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0 0 18px;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;}
.legend span{display:flex;align-items:center;gap:10px;}
.legend .count{color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums;}
.legend-dot{display:inline-block;width:18px;height:18px;border-radius:5px;flex:0 0 auto;border:1px solid transparent;}
@media (min-width:720px){ .legend{grid-template-columns:repeat(4,1fr);} .legend .count{margin-left:0;} }
.hifz-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;}
@media (min-width:420px){ .hifz-grid{grid-template-columns:repeat(7,1fr);} }
@media (min-width:600px){ .hifz-grid{grid-template-columns:repeat(10,1fr);gap:8px;} }
@media (min-width:1100px){ .hifz-grid{grid-template-columns:repeat(12,1fr);} }
.surah-cell{
  position:relative;aspect-ratio:1;border-radius:var(--r-sm);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:var(--sand-soft);color:var(--ink);padding:2px;text-align:center;
  box-shadow:var(--shadow-sm);transition:transform .12s ease, box-shadow .12s ease;font-family:inherit;
}
.surah-cell:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
.surah-cell .cno{font-family:var(--font-serif);font-size:16px;line-height:1;}
.surah-cell.not_started{background:var(--sand-soft);}
.surah-cell.in_progress{background:var(--gold);border-color:var(--gold);}
.surah-cell.in_progress .cno{color:#fff;}
.surah-cell.memorised{background:var(--green);border-color:var(--green);}
.surah-cell.memorised .cno{color:var(--cream);}
.surah-cell.needs_attention{background:var(--attn);border-color:var(--attn);}
.surah-cell.needs_attention .cno{color:#fff;}
.juz-badge{position:absolute;top:3px;left:4px;font-size:8.5px;line-height:1;font-weight:500;color:var(--muted);letter-spacing:0.02em;}
.surah-cell.memorised .juz-badge, .surah-cell.in_progress .juz-badge, .surah-cell.needs_attention .juz-badge{color:rgba(255,255,255,0.78);}

/* ---------- Riwayat ---------- */
.filter-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.filter-row .choice{flex:1;justify-content:center;min-width:fit-content;}
@media (min-width:960px){ .filter-row .choice{flex:0 0 auto;} }
.month-group{margin-bottom:18px;}
.month-label{display:inline-block;font-size:12.5px;font-weight:500;color:var(--ink);background:var(--sand-soft);border-radius:var(--r-pill);padding:5px 12px;margin:0 0 6px;}
.timeline{list-style:none;margin:0;padding:0;}
.entry-row{display:grid;grid-template-columns:62px 28px 1fr auto;align-items:start;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);position:relative;}
.timeline .entry-row:last-child{border-bottom:none;}
.entry-date{font-size:12.5px;color:var(--muted);padding-top:2px;position:relative;padding-left:16px;white-space:nowrap;}
.entry-date::before{content:'';position:absolute;left:0;top:8px;width:7px;height:7px;border-radius:50%;background:var(--gold);}
.timeline .entry-row::before{content:'';position:absolute;left:3px;top:0;bottom:0;width:1px;background:var(--line-strong);}
.timeline .entry-row:first-child::before{top:21px;}
.timeline .entry-row:last-child::before{bottom:calc(100% - 21px);}
.entry-type-icon{color:var(--gold);padding-top:1px;}
.entry-main{font-size:14px;min-width:0;}
.entry-title{font-weight:500;color:var(--ink);}
.entry-detail{color:var(--ink);opacity:.85;}
.entry-note{font-size:12.5px;color:var(--muted);margin-top:3px;font-style:italic;overflow-wrap:anywhere;}
.rating-tag{font-size:11.5px;padding:3px 10px;border-radius:var(--r-pill);white-space:nowrap;font-weight:500;align-self:center;}
.rating-tag.lemah{color:var(--weak);background:var(--weak-tint);}
.rating-tag.sederhana{color:var(--mid);background:var(--mid-tint);}
.rating-tag.lancar{color:var(--good);background:var(--good-tint);}
.type-badge{font-size:11px;padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap;background:var(--sand-soft);color:var(--ink);}
.type-badge.new{background:var(--gold-tint);}
.type-badge.murajaah{background:var(--green-tint);color:var(--green);}
.history-mini .entry-row{grid-template-columns:1fr auto;padding:10px 0;}
.history-mini .entry-row::before{display:none;}
.history-mini .entry-date{padding-left:0;}
.history-mini .entry-date::before{display:none;}
.empty-state{padding:44px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r-lg);}
.empty-state .icon{color:var(--gold);width:32px;height:32px;margin-bottom:8px;}
.back-link{background:none;border:none;color:var(--muted);font-size:13.5px;cursor:pointer;margin-bottom:14px;padding:0;}

[tabindex]:focus-visible, button:focus-visible, .choice:focus-visible, [data-surah-detail]:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important;} }

}

function migrateEntry(e){
  if(e.type === 'murajaah_recent' || e.type === 'murajaah_old'){
    // best-effort: old entries were surah-based: convert to whichever Juz that surah's start ayah belongs to
    const badges = juzBadgesForSurah(e.surah);
    const juz = badges.length ? badges[0] : (JUZ_STARTS.slice().reverse().find(j => j.surah <= e.surah)||{juz:1}).juz;
    return { id:e.id, date:e.date, type:'murajaah', juz, rating:e.rating, note:e.note||'' };
  }
  return e;
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultProgress();
    const p = JSON.parse(raw);
    if(!p) return defaultProgress();
    const wasOldSchema = p.schema_version !== 2;
    const d = defaultProgress();
    p.plan = Object.assign({}, d.plan, p.plan||{});
    p.surahStatus = p.surahStatus || {};
    p.entries = (p.entries || []).map(migrateEntry);
    p.streak = Object.assign({}, d.streak, p.streak||{});
    p.schema_version = 2;
    if(wasOldSchema) saveProgress(p); // persist the upgrade immediately, not just in-memory
    return p;
  }catch(e){ return defaultProgress(); }
}
function saveProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){ /* best effort */ }
}

function loadLanguagePreference(){
  try{
    const raw = localStorage.getItem(LANGUAGE_STORAGE_KEY);
    if(raw === 'en' || raw === 'ms') return raw;
  }catch(e){ /* best effort */ }
  return 'ms';
}
function persistLanguage(lang){
  try{ localStorage.setItem(LANGUAGE_STORAGE_KEY, lang); }catch(e){ /* best effort */ }
}
var LANG = loadLanguagePreference();

function t(key, vars){
  const dict = I18N[LANG] || I18N.ms;
  let str = (key in dict) ? dict[key] : ((key in I18N.ms) ? I18N.ms[key] : key);
  if(vars){
    Object.keys(vars).forEach(k => { str = str.split('{'+k+'}').join(vars[k]); });
  }
  return str;
}
function setLanguage(lang){
  if(lang !== 'en' && lang !== 'ms') return;
  LANG = lang;
  persistLanguage(lang);
  document.documentElement.setAttribute('lang', lang === 'en' ? 'en' : 'ms');
  render();
}

// ===================== Date helpers =====================
function todayStr(){
  const d = new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function addDaysStr(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function daysBetween(dateStr1, dateStr2){
  const a = new Date(dateStr1 + 'T00:00:00'), b = new Date(dateStr2 + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

// ===================== Surah status helpers =====================
function ensureSurahStatus(no){
  if(!PROGRESS.surahStatus[no]){
    PROGRESS.surahStatus[no] = { status:'not_started', memorisedUpTo:0, lastRating:null, lastRevisedDate:null };
  }
  return PROGRESS.surahStatus[no];
}
function getSurahStatus(no){
  return PROGRESS.surahStatus[no] || { status:'not_started', memorisedUpTo:0, lastRating:null, lastRevisedDate:null };
}
function surahCellState(no){
  const st = getSurahStatus(no);
  if(st.status === 'not_started') return 'not_started';
  if(st.status === 'in_progress') return 'in_progress';
  return st.lastRating === 'lemah' ? 'needs_attention' : 'memorised';
}

// ===================== Juz-level helpers =====================
function isJuzFullyMemorised(j){
  return JUZ_SURAH_SPANS[j].every(sp => getSurahStatus(sp.surah).memorisedUpTo >= sp.toAyah);
}
function memorisedJuzList(){
  const out = [];
  for(let j=1;j<=30;j++){ if(isJuzFullyMemorised(j)) out.push(j); }
  return out;
}

// ===================== Traversal order (Hafalan Baru) =====================
function traversalOrder(){
  const base = SURAHS.map(s => s.no);
  return PROGRESS.plan.direction === 'back-to-front' ? base.slice().reverse() : base;
}
function nextSurahNo(current){
  const order = traversalOrder();
  const idx = order.indexOf(current);
  return order[(idx + 1) % order.length];
}

// ===================== New-Hifz suggestion =====================
function computeSuggestedNew(){
  const pos = PROGRESS.plan.positionPointer;
  const surah = getSurah(pos.surah);
  if(!surah) return null;
  if(pos.ayah > surah.totalAyah) return null; // whole Quran done
  const pace = PROGRESS.plan.paceTarget;
  let targetAyat;
  if(pace.pageFraction === 'custom' && pace.customAyat){
    targetAyat = pace.customAyat;
  } else if(pace.pageFraction === 'custom'){
    targetAyat = Math.round((pace.customPages||1) * surah.ayatPerPage);
  } else {
    targetAyat = Math.round((pace.pageFraction||0.5) * surah.ayatPerPage);
  }
  targetAyat = Math.max(1, targetAyat || 1);
  const ayahToSuggested = Math.min(pos.ayah + targetAyat - 1, surah.totalAyah);
  return { surah: pos.surah, ayahFrom: pos.ayah, ayahToSuggested };
}

// ===================== Murajaah: calendar-based rotation =====================
// The whole point: "today's Juz" is derived purely from the date and the
// current cycle length, never from a log of what was or wasn't done. Missing
// a day never creates a backlog - tomorrow's slot is unaffected either way.
function computeTodaysMurajaah(){
  const juzList = memorisedJuzList();
  const J = juzList.length;
  const M = Math.max(1, PROGRESS.plan.murajaahCycleDays || 7);
  if(J === 0 || !PROGRESS.plan.cycleStartDate){
    return { active:false, dueJuz:[], dayInCycle:0, cycleDays:M, completedThisCycle:0, totalJuz:0, bonusWeak:[] };
  }
  const totalDays = Math.max(0, daysBetween(PROGRESS.plan.cycleStartDate, todayStr()));
  const dayInCycle = totalDays % M;
  const dueJuz = juzList.filter((_, idx) => idx % M === dayInCycle);

  const cycleIterationStart = addDaysStr(todayStr(), -dayInCycle);
  const loggedThisCycle = new Set(
    PROGRESS.entries.filter(e => e.type==='murajaah' && e.date >= cycleIterationStart).map(e => e.juz)
  );

  // Supplementary (non-scheduling) hint: any needs-attention surah, shown
  // alongside today's due Juz as an optional extra, never forcing a reschedule.
  const bonusWeak = needsAttentionList().map(s => s.name);

  return {
    active: true, dueJuz, dayInCycle, cycleDays: M,
    completedThisCycle: loggedThisCycle.size, totalJuz: J,
    doneToday: dueJuz.every(j => loggedThisCycle.has(j)),
    bonusWeak
  };
}

function applyMurajaahEntry(juz, rating, date){
  JUZ_SURAH_SPANS[juz].forEach(sp => {
    const st = getSurahStatus(sp.surah);
    if(st.memorisedUpTo > 0){ // only rate portions actually memorised
      const real = ensureSurahStatus(sp.surah);
      real.lastRating = rating;
      real.lastRevisedDate = date;
    }
  });
}

// ===================== Logging =====================
function logEntry(data){
  const date = todayStr();
  let entry;
  if(data.type === 'new'){
    entry = { id: Date.now()+'-'+Math.random().toString(36).slice(2), date, type:'new',
      surah:data.surah, ayahFrom:data.ayahFrom, ayahTo:data.ayahTo, rating:data.rating, note:data.note||'' };
    PROGRESS.entries.push(entry);
    const st = ensureSurahStatus(data.surah);
    st.lastRating = data.rating; st.lastRevisedDate = date;
    const surahRef = getSurah(data.surah);
    st.memorisedUpTo = Math.max(st.memorisedUpTo, data.ayahTo);
    st.status = st.memorisedUpTo >= surahRef.totalAyah ? 'memorised' : 'in_progress';
    if(data.surah === PROGRESS.plan.positionPointer.surah){
      if(st.status === 'memorised'){
        let next = nextSurahNo(data.surah), guard = 0;
        while(getSurahStatus(next).status === 'memorised' && guard < 114){ next = nextSurahNo(next); guard++; }
        const nextSt = getSurahStatus(next);
        PROGRESS.plan.positionPointer = { surah: next, ayah: (nextSt.memorisedUpTo||0) + 1 };
      } else {
        PROGRESS.plan.positionPointer = { surah: data.surah, ayah: st.memorisedUpTo + 1 };
      }
    }
  } else {
    entry = { id: Date.now()+'-'+Math.random().toString(36).slice(2), date, type:'murajaah',
      juz:data.juz, rating:data.rating, note:data.note||'' };
    PROGRESS.entries.push(entry);
    applyMurajaahEntry(data.juz, data.rating, date);
  }
  updateStreak(date);
  saveProgress(PROGRESS);
  return entry;
}

function updateStreak(date){
  const s = PROGRESS.streak;
  if(s.lastActiveDate === date) return;
  const yesterday = addDaysStr(date, -1);
  s.current = (s.lastActiveDate === yesterday) ? s.current + 1 : 1;
  s.longest = Math.max(s.longest, s.current);
  s.lastActiveDate = date;
}

// ===================== Today completion =====================
function isTodayComplete(){
  if(!PROGRESS.plan.setupDone) return false;
  const t = todayStr();
  const newDue = computeSuggestedNew();
  const newLoggedToday = PROGRESS.entries.some(e => e.date===t && e.type==='new');
  const newOk = !newDue || newLoggedToday;
  const m = computeTodaysMurajaah();
  const murajaahOk = !m.active || m.dueJuz.length===0 || m.doneToday;
  return newOk && murajaahOk;
}

// ===================== Whole-Quran progress =====================
function totalMemorisedAyatCount(){
  return SURAHS.reduce((sum,s) => sum + (getSurahStatus(s.no).status==='memorised' ? s.totalAyah : (getSurahStatus(s.no).memorisedUpTo||0)), 0);
}
function totalAyatInQuran(){ return SURAHS.reduce((sum,s)=>sum+s.totalAyah,0); }
function percentMemorised(){ return Math.round((totalMemorisedAyatCount() / totalAyatInQuran()) * 100); }
function needsAttentionList(){
  return SURAHS.filter(s => getSurahStatus(s.no).status==='memorised' && getSurahStatus(s.no).lastRating==='lemah');
}

// Human-readable "starting point" - shows "Juz N" only when the actual
// position pointer sits exactly at a real Juz boundary (e.g. baseline import
// of complete Juz 1-10 correctly continues at "Juz 11"); otherwise shows the
// precise Surah+Ayah, since that's what the pointer actually is for any
// irregular/individual-surah selection. Language-aware: computed fresh from
// LANG at call time, never baked into stored state.
function positionPointerLabel(){
  const pos = PROGRESS.plan.positionPointer;
  const surah = getSurah(pos.surah);
  if(!surah) return '&mdash;';
  if(pos.ayah > surah.totalAyah) return t('positionQuranDone');
  const juzMatch = JUZ_STARTS.find(j => j.surah === pos.surah && j.ayah === pos.ayah);
  if(juzMatch) return t('positionJuz', {n:juzMatch.juz});
  return t('positionSurahAyah', {surah: surah.name, ayah: pos.ayah});
}

// ===================== Assessment -> Recommendation math =====================
function suggestCycleDays(totalJuz, capacityJuzPerDay){
  if(totalJuz <= 0) return 7;
  const days = Math.ceil(totalJuz / Math.max(0.5, capacityJuzPerDay||1));
  return Math.max(5, Math.min(days, 30));
}
function juzPerDayForCycle(totalJuz, cycleDays){
  if(totalJuz <= 0) return 0;
  return Math.ceil(totalJuz / Math.max(1, cycleDays));
}

// ===================== Calendar export (Google Calendar link) =====================
// Reads the existing plan but changes nothing about how Hifz/Murajaah logic
// works. Opens a Google Calendar "add event" link in a new tab - no download,
// no API key, no OAuth, no backend. The link includes ctz (IANA timezone,
// read from the browser) plus wall-clock local times, which is Google's
// documented way to have the event interpreted correctly without needing to
// know or embed timezone offset data ourselves. Title/description text is
// generated fresh from the current LANG at call time, so an exported event
// always matches whichever language was active when "Add to Calendar" was
// clicked.
const CAL_BYDAY = { isnin:'MO', selasa:'TU', rabu:'WE', khamis:'TH', jumaat:'FR', sabtu:'SA', ahad:'SU' };
const CAL_ISO_WEEKDAY = { isnin:1, selasa:2, rabu:3, khamis:4, jumaat:5, sabtu:6, ahad:7 };
const CAL_TIME_CLOCK = { subuh:'0530', pagi:'0800', petang:'1500', maghrib:'1930', malam:'2100' };
const CAL_DEFAULT_TIME = '2000';
const CAL_DURATION_MINUTES = 30;

function nextDateForIsoWeekday(isoWeekdayTarget){
  const now = new Date();
  const curIso = now.getDay() === 0 ? 7 : now.getDay();
  let diff = isoWeekdayTarget - curIso;
  if(diff < 0) diff += 7;
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff);
  return d;
}
function addMinutesClock(hhmm, minutes){
  const h = parseInt(hhmm.slice(0,2),10), m = parseInt(hhmm.slice(2,4),10);
  const total = h*60 + m + minutes;
  const nh = Math.floor((total % (24*60)) / 60), nm = total % 60;
  return String(nh).padStart(2,'0') + String(nm).padStart(2,'0');
}
function getUserTimezone(){
  try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; }catch(e){ return 'UTC'; }
}

function calPaceLabel(paceTarget){
  if(paceTarget.pageFraction === 'custom'){
    return paceTarget.customAyat ? t('calAyatCustom', {n:paceTarget.customAyat}) : t('calPageCustom', {n:paceTarget.customPages||1});
  }
  if(paceTarget.pageFraction === 0.25) return t('calPageQuarter');
  if(paceTarget.pageFraction === 1) return t('calPageOne');
  return t('calPageHalf');
}

// eventType: 'hafalan' | 'murajaah'. Returns { ok:true, url, title } or
// { ok:false, reason } - reason is a user-facing message (in the current
// language) for the one case that can't proceed (no active days chosen yet).
function buildGoogleCalendarUrl(eventType){
  const p = PROGRESS.plan;
  const activeDayKeys = p.activeDays || [];
  if(activeDayKeys.length === 0){
    return { ok:false, reason: t('calendarNoActiveDays') };
  }
  const byDayList = activeDayKeys.map(k => CAL_BYDAY[k]).filter(Boolean);
  const earliestIso = Math.min(...activeDayKeys.map(k => CAL_ISO_WEEKDAY[k]));
  const anchorDate = nextDateForIsoWeekday(earliestIso);
  const clockStart = p.preferredTime ? (CAL_TIME_CLOCK[p.preferredTime] || CAL_DEFAULT_TIME) : CAL_DEFAULT_TIME;
  const clockEnd = addMinutesClock(clockStart, CAL_DURATION_MINUTES);
  const timeNote = p.preferredTime === 'maghrib' ? t('calMaghribNote') : '';

  const pad = n => String(n).padStart(2,'0');
  const datePart = `${anchorDate.getFullYear()}${pad(anchorDate.getMonth()+1)}${pad(anchorDate.getDate())}`;
  const datesParam = `${datePart}T${clockStart}00/${datePart}T${clockEnd}00`;

  const paceLabel = calPaceLabel(p.paceTarget);
  const juzCount = memorisedJuzList().length;
  const dailyMurajaahTarget = juzPerDayForCycle(juzCount, p.murajaahCycleDays);

  let title, description;
  if(eventType === 'hafalan'){
    title = t('calHafalanTitle', {pace:paceLabel});
    description = t('calHafalanDesc', {pace:paceLabel, timeNote});
  } else {
    title = t('calMurajaahTitle', {n:dailyMurajaahTarget});
    description = t('calMurajaahDesc', {n:dailyMurajaahTarget, cycle:p.murajaahCycleDays, timeNote});
  }

  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: title.replace(/&mdash;/g,'—'),
    dates: datesParam,
    details: description.replace(/&mdash;/g,'—'),
    recur: `RRULE:FREQ=WEEKLY;BYDAY=${byDayList.join(',')}`,
    ctz: getUserTimezone()
  });
  return { ok:true, url:`https://calendar.google.com/calendar/render?${params.toString()}`, title };
}

function approxJuzFromSelection(selectionSet){
  const totalAyahSelected = SURAHS.reduce((sum,s) => sum + (selectionSet.has(s.no) ? s.totalAyah : 0), 0);
  return Math.round(totalAyahSelected / (totalAyatInQuran()/30));
}

function assessmentHtml(){
  if(!STATE.assessmentForm) initAssessmentForm();
  const step = STATE.assessmentStep;
  const totalSteps = 4;
  let body = '';
  if(step === 1) body = assessmentStep1();
  else if(step === 2) body = assessmentStep2();
  else if(step === 3) body = assessmentStep3();
  else body = assessmentStep4();

  return `
  <div class="wizard-head">
    <div class="wizard-step">${t('stepOf', {step, total:totalSteps})}</div>
    <div class="progress-track"><div class="progress-fill" style="width:${(step/totalSteps)*100}%"></div></div>
  </div>
  <div class="wizard-body">${body}</div>
  <div class="quiz-footer">
    ${step>1 ? `<button class="btn btn-secondary" data-action="assess-back">${t('stepBack')}</button>` : `<span></span>`}
    <button class="btn btn-primary" data-action="assess-next">${step<totalSteps ? t('stepNext') : t('stepSeeRecommendation')} ${icon('chevron','icon-sm')}</button>
  </div>`;
}

function assessmentStep1(){
  const f = STATE.assessmentForm;
  const juzOfSurah = {};
  SURAHS.forEach(s => {
    const starts = juzBadgesForSurah(s.no);
    juzOfSurah[s.no] = starts.length ? Math.min(...starts) : (juzOfSurah[s.no-1]||1);
  });
  let pickerHtml = '';
  let currentJuz = null;
  SURAHS.forEach(s => {
    const j = juzOfSurah[s.no];
    if(j !== currentJuz){ pickerHtml += `<div class="juz-heading">${t('step1JuzHeading',{n:j})}</div>`; currentJuz = j; }
    const checked = f.baselineSelection.has(s.no) ? 'checked' : '';
    pickerHtml += `<label class="surah-picker-item"><input type="checkbox" data-baseline-surah="${s.no}" ${checked}> ${escapeHtml(s.name)} <span class="muted">${t('step1AyahSuffix',{n:s.totalAyah})}</span></label>`;
  });

  return `
  <h2>${t('step1Title')}</h2>
  <p class="muted">${t('step1Desc')}</p>
  <div class="field">
    <div class="surah-picker">${pickerHtml}</div>
  </div>
  <div class="field">
    <label>${t('step1DirectionQuestion')}</label>
    <div class="choice-group">
      <div class="choice ${f.direction==='front-to-back'?'selected':''}" data-set-assess="direction:front-to-back">${t('step1DirectionForward')}</div>
      <div class="choice ${f.direction==='back-to-front'?'selected':''}" data-set-assess="direction:back-to-front">${t('step1DirectionBackward')}</div>
    </div>
  </div>
  ${f.baselineSelection.size > 0 ? `
  <div class="field">
    <label>${t('step1QualityQuestion')}</label>
    <div class="choice-group">
      <div class="choice ${f.quality==='kukuh'?'selected':''}" data-set-assess="quality:kukuh">${t('step1QualityKukuh')}</div>
      <div class="choice ${f.quality==='sederhana'?'selected':''}" data-set-assess="quality:sederhana">${t('step1QualitySederhana')}</div>
      <div class="choice ${f.quality==='lemah'?'selected':''}" data-set-assess="quality:lemah">${t('step1QualityLemah')}</div>

function newCardHtml(){

  const m = computeTodaysMurajaah();
  if(!m.active){
    return taskCardHtml({ cls:'is-empty', icon:'refresh', title:t('murajaahCardTitle'), body:`<div class="task-sub">${t('murajaahCardInactive')}</div>` });
  }
  const cycleText = t('murajaahCardCycleProgress',{day:m.dayInCycle+1, total:m.cycleDays, done:m.completedThisCycle, all:m.totalJuz});
  const cyclePct = m.totalJuz ? Math.round((m.completedThisCycle/m.totalJuz)*100) : 0;
  const ring = `<span title="${t('dashCycleProgress')}">${miniRing(cyclePct, 62)}</span>`;
  if(m.doneToday){
    return taskCardHtml({ cls:'is-done', icon:'refresh', title:t('murajaahCardTitle'), ring,
      body:`<div class="task-sub">${cycleText}</div><div class="done-pill">${icon('check')} ${t('murajaahCardDoneToday')}</div>` });
  }
  const juzLabel = t('juzListLabel', {list: m.dueJuz.join(', ')});
  return taskCardHtml({
    icon:'refresh', title:t('murajaahCardTitle'), ring,
    body:`<div class="task-main">${juzLabel}</div><div class="task-sub">${cycleText}</div>
      ${m.bonusWeak.length ? `<div class="bonus-note">${t('murajaahCardBonus',{list: escapeHtml(m.bonusWeak.join(', '))})}</div>` : ''}`,
    footer:`<button class="btn btn-primary btn-block" data-action="log-murajaah" data-juz="${m.dueJuz[0]}">${icon('play')} ${t('murajaahCardButton')}</button>`
  });
}

// ===================== RANCANG (interactive dashboard) =====================
function ringSvg(pct, size){
  size = size || 104;
  const r = (size/2) - 10;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - Math.min(100,Math.max(0,pct))/100);
  const mid = size/2;
  return `
  <svg class="ring-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${mid}" cy="${mid}" r="${r}" fill="none" stroke="var(--sand)" stroke-width="8"/>
    <circle cx="${mid}" cy="${mid}" r="${r}" fill="none" stroke="var(--green)" stroke-width="8"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" stroke-linecap="round"
      transform="rotate(-90 ${mid} ${mid})" ${pct<=0?'stroke-opacity="0"':''}/>
    <text x="${mid}" y="${mid}" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-size="17" fill="var(--ink)">${pct}%</text>
  </svg>`;
}

  const legendItem = (bg, border, label, n) => `<span><span class="legend-dot" style="background:${bg};border-color:${border};"></span>${label}<span class="count">${n}</span></span>`;
  return `
  ${pageHeadHtml('grid', t('petaTitle'), t('petaDesc'))}
  <div class="legend">
    ${legendItem('var(--green)','var(--green)', t('legendMemorised'), counts.memorised)}
    ${legendItem('var(--gold)','var(--gold)', t('legendInProgress'), counts.in_progress)}
    ${legendItem('var(--sand-soft)','var(--line-strong)', t('legendNotStarted'), counts.not_started)}
    ${legendItem('var(--attn)','var(--attn)', t('legendNeedsAttention'), counts.needs_attention)}
  </div>
  <div class="hifz-grid">${cells}</div>
  `;
}

// ===================== RIWAYAT =====================
function riwayatHtml(){
  const filters = [ {key:'all', labelKey:'filterAll'}, {key:'new', labelKey:'filterNew'}, {key:'murajaah', labelKey:'filterMurajaah'} ];
  const filtered = PROGRESS.entries
    .filter(e => STATE.riwayatFilter==='all' || e.type===STATE.riwayatFilter)
    .slice().sort((a,b) => b.date.localeCompare(a.date) || (b.id>a.id?1:-1));

  const rowHtml = e => {
    const detail = e.type==='new'
      ? `${escapeHtml(getSurah(e.surah)?.name||('Surah '+e.surah))} &middot; ${t('riwayatAyahRange',{from:e.ayahFrom, to:e.ayahTo})}`
      : t('riwayatJuz',{n:e.juz});
    const ratingLabel = e.rating ? t(RATING_LABEL_KEYS[e.rating]||'') : '';
    return `
    <li class="entry-row">
      <div class="entry-date">${shortDateLabel(e.date)}</div>
      <div class="entry-type-icon">${icon(e.type==='new'?'book':'refresh')}</div>
      <div class="entry-main">
        <div class="entry-title">${e.type==='new'?t('entryTypeNew'):t('entryTypeMurajaah')}</div>
        <div class="entry-detail">${detail}</div>
        ${e.note ? `<div class="entry-note">${escapeHtml(e.note)}</div>` : ''}
      </div>
      ${ratingLabel ? `<span class="rating-tag ${e.rating}">${ratingLabel}</span>` : '<span></span>'}
    </li>`;
  };

  // Group (already date-sorted) entries by calendar month for scanning.
  const groups = [];
  filtered.forEach(e => {
    const key = e.date.slice(0,7);
    if(!groups.length || groups[groups.length-1].key !== key) groups.push({ key, items: [] });
    groups[groups.length-1].items.push(e);
  });

  return `
  ${pageHeadHtml('clock', t('riwayatTitle'), t('riwayatDesc'))}
  <div class="filter-row">
    ${filters.map(f => `<div class="choice ${STATE.riwayatFilter===f.key?'selected':''}" data-set-filter="${f.key}" role="button" tabindex="0">${t(f.labelKey)}</div>`).join('')}
  </div>
  ${filtered.length
    ? `<div class="card">${groups.map(g => `
        <div class="month-group">
          <div class="month-label">${monthLabel(g.items[0].date)}</div>
          <ul class="timeline">${g.items.map(rowHtml).join('')}</ul>
        </div>`).join('')}</div>`
    : `<div class="empty-state">${icon('clock')}<div>${t('riwayatEmpty')}</div></div>`}
  `;
}


// ===================== Modal =====================
function modalHtml(){
  if(!STATE.modal) return '';
  if(STATE.modal.type === 'log-new') return logNewModalHtml();
  if(STATE.modal.type === 'log-murajaah') return logMurajaahModalHtml();
  if(STATE.modal.type === 'surah') return surahDetailModalHtml();
  if(STATE.modal.type === 'day') return dayDetailModalHtml();
  if(STATE.modal.type === 'calendar-choice') return calendarChoiceModalHtml();
  return '';
}

function surahSelectOptions(selected){
  return SURAHS.map(s => `<option value="${s.no}" ${s.no===selected?'selected':''}>${s.no}. ${escapeHtml(s.name)} (${s.totalAyah} ${t('ayahWord')})</option>`).join('');
}
function juzSelectOptions(selected, list){

}

      <div class="detail-row"><span class="dr-label">${icon('book')} ${t('dayDetailHafalanBaru')}</span><span>${paceLabel}</span></div>

function surahDetailModalHtml(){
  const no = STATE.modal.surahNo;
  const s = getSurah(no);
  const st = getSurahStatus(no);
  const statusLabelKeys = {not_started:'statusNotStarted', in_progress:'statusInProgress', memorised:'statusMemorised'};
  const statusLabel = t(statusLabelKeys[st.status] || st.status);
  const history = PROGRESS.entries.filter(e => (e.type==='new' && e.surah===no) || (e.type==='murajaah' && juzBadgesForSurah(no).length && JUZ_SURAH_SPANS[e.juz] && JUZ_SURAH_SPANS[e.juz].some(sp=>sp.surah===no)))
    .slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);

  return `
  <div class="modal-overlay" data-close-modal="1">
    <div class="modal-sheet" data-stop-propagation="1" role="dialog" aria-modal="true">
      <div class="modal-header"><h3 style="margin:0;">${escapeHtml(s.name)}</h3>${closeBtnHtml()}</div>
      <div class="detail-row"><span class="dr-label">${t('surahDetailTotalAyah')}</span><span>${s.totalAyah}</span></div>
      <div class="detail-row"><span class="dr-label">${t('surahDetailStatus')}</span><span>${statusLabel}</span></div>
      <div class="detail-row"><span class="dr-label">${t('surahDetailMemorisedUpTo')}</span><span>${st.memorisedUpTo||0}</span></div>
      <div class="detail-row"><span class="dr-label">${t('surahDetailLastQuality')}</span><span>${st.lastRating?`<span class="rating-tag ${st.lastRating}">${t(RATING_LABEL_KEYS[st.lastRating])}</span>`:'&mdash;'}</span></div>
      <div class="detail-row"><span class="dr-label">${t('surahDetailLastDate')}</span><span>${st.lastRevisedDate||'&mdash;'}</span></div>
      ${history.length ? `
      <h3 class="section-title" style="font-size:16px;margin-top:20px;">${icon('clock')} ${t('surahDetailHistory')}</h3>
      <div class="history-mini">
      ${history.map(e => e.type==='new'
        ? `<div class="entry-row"><div class="entry-main"><div class="entry-date">${e.date}</div>${t('surahDetailAyahRange',{from:e.ayahFrom, to:e.ayahTo})} <span class="rating-tag ${e.rating}">${t(RATING_LABEL_KEYS[e.rating])}</span></div><div class="type-badge new">${t('entryTypeNew')}</div></div>`
        : `<div class="entry-row"><div class="entry-main"><div class="entry-date">${e.date}</div>${t('surahDetailMurajaahJuz',{n:e.juz})} <span class="rating-tag ${e.rating}">${t(RATING_LABEL_KEYS[e.rating])}</span></div><div class="type-badge murajaah">${t('entryTypeMurajaah')}</div></div>`
      ).join('')}
      </div>
      ` : `<p class="muted" style="margin-top:14px;">${t('surahDetailNoHistory')}</p>`}
    </div>
  </div>`;
}

// ===================== Events =====================
function bindEvents(){
  app.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', () => go(el.getAttribute('data-nav'))));

  const langToggle = document.getElementById('langToggle');
  if(langToggle) langToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-lang]');
    if(!btn) return;
    setLanguage(btn.getAttribute('data-lang'));
  });

  // ---------- Home quick-log ----------
  const newBtn = app.querySelector('[data-action="log-new"]');
  if(newBtn) newBtn.addEventListener('click', () => {
    const sug = computeSuggestedNew();
    openModal({ type:'log-new', prefill:{ surah:sug.surah, ayahFrom:sug.ayahFrom, ayahTo:sug.ayahToSuggested }, rating:null, note:'' });
  });
  const murajaahBtn = app.querySelector('[data-action="log-murajaah"]');
  if(murajaahBtn) murajaahBtn.addEventListener('click', () => {
    const juz = parseInt(murajaahBtn.getAttribute('data-juz'),10);
    openModal({ type:'log-murajaah', prefill:{ juz }, rating:null, note:'' });
  });

  // ---------- Assessment wizard ----------
  if(!STATE.assessmentForm && STATE.screen === 'assessment') initAssessmentForm();
  app.querySelectorAll('[data-set-assess]').forEach(el => el.addEventListener('click', () => {
    const [field, raw] = el.getAttribute('data-set-assess').split(':');
    const numericFields = ['pageFraction','capacity','cycleDays'];
    let value = raw;
    if(numericFields.includes(field) && raw !== 'custom') value = parseFloat(raw);
    STATE.assessmentForm[field] = value;
    render();
  }));
  app.querySelectorAll('[data-toggle-day]').forEach(el => el.addEventListener('click', () => {
    const key = el.getAttribute('data-toggle-day');
    if(STATE.assessmentForm.activeDays.has(key)) STATE.assessmentForm.activeDays.delete(key);
    else STATE.assessmentForm.activeDays.add(key);
    render();
  }));
  app.querySelectorAll('[data-baseline-surah]').forEach(el => el.addEventListener('change', () => {
    const no = parseInt(el.getAttribute('data-baseline-surah'),10);
    if(el.checked) STATE.assessmentForm.baselineSelection.add(no);
    else STATE.assessmentForm.baselineSelection.delete(no);
    // no render() here - the checkbox already reflects its own new state visually,
    // and a full re-render on every checkbox click would be needlessly disruptive
    // (this mirrors the same fix applied to the old Rancang picker previously)
  }));
  app.querySelectorAll('[data-form-field]').forEach(el => {
    if(el.closest('.modal-sheet')) return; // modal fields are bound separately below
    el.addEventListener('input', () => {
      const field = el.getAttribute('data-form-field');
      STATE.assessmentForm[field] = el.value ? parseFloat(el.value) : null;
    });
  });
  const assessNext = app.querySelector('[data-action="assess-next"]');
  if(assessNext) assessNext.addEventListener('click', () => {
    if(STATE.assessmentStep < 4){ STATE.assessmentStep++; render(); }
    else { STATE.screen = 'recommendation'; render(); }
  });
  const assessBack = app.querySelector('[data-action="assess-back"]');
  if(assessBack) assessBack.addEventListener('click', () => { STATE.assessmentStep = Math.max(1, STATE.assessmentStep-1); render(); });

  // ---------- Recommendation ----------
  const acceptBtn = app.querySelector('[data-action="accept-recommendation"]');
  if(acceptBtn) acceptBtn.addEventListener('click', () => {
    const f = STATE.assessmentForm;
    const approxJuz = approxJuzFromSelection(f.baselineSelection);
    const cycleDays = f.cycleDays || suggestCycleDays(approxJuz, f.capacity);

    // Baseline import: apply EXACTLY the surahs the user checked/unchecked in
    // Step 1 - never inferred from a Juz count. Checking a surah marks it fully
    // memorised; unchecking one only reverts it if it has no real logged entries
    // behind it (never destroys genuine logged progress). Already-memorised
    // surahs the user left checked are left completely untouched (their real
    // rating/history is preserved, not overwritten by this screen's quality pick).
    const chosenRating = QUALITY_TO_RATING[f.quality] || 'sederhana';
    SURAHS.forEach(s => {
      const wasMemorised = getSurahStatus(s.no).status === 'memorised';
      const nowChecked = f.baselineSelection.has(s.no);
      if(nowChecked && !wasMemorised){
        const st = ensureSurahStatus(s.no);
        st.status = 'memorised'; st.memorisedUpTo = s.totalAyah;
        st.lastRating = chosenRating; st.lastRevisedDate = todayStr();
      } else if(!nowChecked && wasMemorised && !PROGRESS.entries.some(e => e.type==='new' && e.surah===s.no)){
        delete PROGRESS.surahStatus[s.no];
      }
    });

    PROGRESS.plan.direction = f.direction;
    PROGRESS.plan.paceTarget.pageFraction = f.pageFraction;
    PROGRESS.plan.paceTarget.customPages = f.pageFraction==='custom' ? f.customPages : null;
    PROGRESS.plan.paceTarget.customAyat = f.pageFraction==='custom' ? f.customAyat : null;
    PROGRESS.plan.hafalanDaysPerWeek = f.hafalanDaysPerWeek || 5;
    PROGRESS.plan.preferredTime = f.preferredTime;
    PROGRESS.plan.activeDays = [...f.activeDays];
    PROGRESS.plan.murajaahCapacityPerDay = f.capacity;
    PROGRESS.plan.murajaahCycleDays = cycleDays;
    if(!PROGRESS.plan.cycleStartDate) PROGRESS.plan.cycleStartDate = todayStr(); // anchor set once, ever

    // Recompute the new-Hifz position pointer: first non-memorised surah in traversal order
    const surahOrder = traversalOrder();
    let next = surahOrder.find(no => getSurahStatus(no).status !== 'memorised');
    if(next === undefined) next = surahOrder[surahOrder.length-1];
    const nextSt = getSurahStatus(next);
    PROGRESS.plan.positionPointer = { surah: next, ayah: (nextSt.memorisedUpTo||0) + 1 };

    PROGRESS.plan.setupDone = true;
    saveProgress(PROGRESS);
    STATE.assessmentForm = null;
    go('utama');
  });
  const adjustBtn = app.querySelector('[data-action="adjust-recommendation"]');
  if(adjustBtn) adjustBtn.addEventListener('click', () => { STATE.screen='assessment'; STATE.assessmentStep=2; render(); });

  // ---------- Rancang ----------
  const editPlanBtn = app.querySelector('[data-action="edit-plan"]');
  if(editPlanBtn) editPlanBtn.addEventListener('click', () => { initAssessmentForm(); STATE.screen='assessment'; STATE.assessmentStep=1; render(); });

  // ---------- Rancang dashboard ----------
  app.querySelectorAll('[data-day-detail]').forEach(el => el.addEventListener('click', () => {
    openModal({ type:'day', dayKey: el.getAttribute('data-day-detail') });
  }));
  const exportBtn = app.querySelector('[data-action="calendar-choice"]');
  if(exportBtn) exportBtn.addEventListener('click', () => { openModal({ type:'calendar-choice' }); });

  // ---------- Peta Hifz ----------
  app.querySelectorAll('[data-surah-detail]').forEach(el => el.addEventListener('click', () => {
    openModal({ type:'surah', surahNo: parseInt(el.getAttribute('data-surah-detail'),10) });
  }));

  // ---------- Riwayat ----------
  app.querySelectorAll('[data-set-filter]').forEach(el => el.addEventListener('click', () => {
    STATE.riwayatFilter = el.getAttribute('data-set-filter'); render();
  }));

  // ---------- Modal-internal ----------
  if(STATE.modal){
    const overlay = app.querySelector('[data-close-modal]');
    if(overlay) overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
    const sheet = app.querySelector('[data-stop-propagation]');
    if(sheet) sheet.addEventListener('click', (e) => e.stopPropagation());
    const closeBtn = app.querySelector('[data-action="close-modal"]');
    if(closeBtn) closeBtn.addEventListener('click', closeModal);

    app.querySelectorAll('[data-set-rating]').forEach(el => el.addEventListener('click', () => {
      STATE.modal.rating = el.getAttribute('data-set-rating'); render();
    }));
    app.querySelectorAll('[data-open-gcal]').forEach(el => el.addEventListener('click', () => {
      const eventType = el.getAttribute('data-open-gcal');
      const result = buildGoogleCalendarUrl(eventType);
      if(!result.ok){ alert(result.reason); return; }
      window.open(result.url, '_blank', 'noopener');
      closeModal();
    }));
    app.querySelectorAll('.modal-sheet [data-modal-field]').forEach(el => {
      const evt = (el.tagName==='SELECT') ? 'change' : 'input';
      el.addEventListener(evt, () => {
        const field = el.getAttribute('data-modal-field');
        STATE.modal[field] = (field==='surah'||field==='ayahFrom'||field==='ayahTo'||field==='juz') ? parseInt(el.value,10) : el.value;
      });
    });

    const submitNew = app.querySelector('[data-action="submit-log-new"]');
    if(submitNew) submitNew.addEventListener('click', () => {
      if(!STATE.modal.rating){ alert(t('alertPickQuality')); return; }
      const surahEl = document.getElementById('logSurahSelect');
      const fromEl = document.getElementById('logAyahFrom');
      const toEl = document.getElementById('logAyahTo');
      const noteEl = document.getElementById('logNote');
      const surah = parseInt((surahEl?surahEl.value:STATE.modal.surah||STATE.modal.prefill.surah),10);
      const ayahFrom = parseInt((fromEl?fromEl.value:STATE.modal.ayahFrom||STATE.modal.prefill.ayahFrom),10);
      const ayahTo = parseInt((toEl?toEl.value:STATE.modal.ayahTo||STATE.modal.prefill.ayahTo),10);
      const note = noteEl ? noteEl.value : (STATE.modal.note||'');
      if(!ayahFrom || !ayahTo || ayahTo < ayahFrom){ alert(t('alertCheckAyahRange')); return; }
      const surahRef = getSurah(surah);
      if(ayahFrom < 1 || ayahTo > surahRef.totalAyah){ alert(t('alertAyahOutOfRange')); return; }
      logEntry({ type:'new', surah, ayahFrom, ayahTo, rating: STATE.modal.rating, note });
      closeModal();
    });

    const submitMurajaah = app.querySelector('[data-action="submit-log-murajaah"]');
    if(submitMurajaah) submitMurajaah.addEventListener('click', () => {
      if(!STATE.modal.rating){ alert(t('alertPickQuality')); return; }
      const juzEl = document.getElementById('logJuzSelect');
      const noteEl = document.getElementById('logNote');
      const juz = parseInt((juzEl?juzEl.value:STATE.modal.juz||STATE.modal.prefill.juz),10);
      const note = noteEl ? noteEl.value : (STATE.modal.note||'');
      logEntry({ type:'murajaah', juz, rating: STATE.modal.rating, note });
      closeModal();
    });
  }
}

document.documentElement.setAttribute('lang', LANG === 'en' ? 'en' : 'ms');
render();

</script>
